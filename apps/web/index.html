<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXA — Universal Matching Platform</title>
    <meta name="description" content="恋愛、友だち、仕事、趣味、コミュニティ。用途に合わせて設計できる高級感のある万能型マッチングプラットフォーム。" />
    <meta name="theme-color" content="#0b0b0a" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NEXA — Universal Matching Platform" />
    <meta property="og:description" content="新しいつながりのサービスを作るためのプラットフォーム。" />
    <meta name="robots" content="index,follow" />
    <style>
      :root{--ink:#11110f;--paper:#f4f0e8;--gold:#b9a486;--line:rgba(255,255,255,.1);--ease:cubic-bezier(.2,.8,.2,1)}
      html{scroll-behavior:smooth}
      body{background:var(--paper);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
      ::selection{background:#b9a486;color:#11110f}
      button,a{cursor:pointer}
      .salesLanding{overflow:hidden;background:var(--paper)}
      .salesHero{position:relative;min-height:760px;background:radial-gradient(circle at 75% 35%,rgba(185,164,134,.13),transparent 25%),linear-gradient(180deg,#0b0b0a 0%,#11110f 100%)}
      .salesHero:after{opacity:.8}
      .salesHeroCopy h1{font-weight:500;text-shadow:0 1px 0 rgba(255,255,255,.04)}
      .salesHeroCopy h1 em{font-style:normal;background:linear-gradient(120deg,#f5f0e8,#b9a486);-webkit-background-clip:text;background-clip:text;color:transparent}
      .salesHeroCopy>p{max-width:590px}
      .salesProduct{border-radius:3px;background:linear-gradient(145deg,#1a1916,#0d0d0c);box-shadow:0 40px 100px rgba(0,0,0,.42),0 0 0 1px rgba(185,164,134,.05)}
      .salesProductMain{background:radial-gradient(circle at 30% 45%,rgba(185,164,134,.12),transparent 32%),linear-gradient(135deg,#171714,#0e0e0d)}
      .salesProductInfo button{border-radius:999px;transition:all .3s var(--ease)}
      .salesProductInfo button:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.25)}
      .heroScroll{opacity:.72}
      .salesIntro,.useCaseSection,.featureSection,.customSection,.safetySection,.globalSection{isolation:isolate}
      .sectionHeading h2,.featureIntro h2,.customIntro h2,.safetyCopy h2,.globalCopy h2{letter-spacing:-.055em}
      .useCaseGrid article,.featureList article,.customCard,.safetyPoints span{transition:transform .4s var(--ease),background .4s ease,border-color .4s ease,box-shadow .4s ease}
      .useCaseGrid article:hover,.customCard:hover{transform:translateY(-7px)}
      .featureList article:hover{transform:translateX(8px)}
      .safetyPoints span:hover{transform:translateY(-4px)}
      .matchingDemo{background:linear-gradient(180deg,#f4f0e8,#ebe5d9);padding-top:clamp(100px,12vw,170px);padding-bottom:clamp(100px,12vw,170px)}
      .matchingDemoHeader h2{font-weight:500}
      .matchingDemoHeader h2 em{background:linear-gradient(120deg,#a58a63,#c9b99e);-webkit-background-clip:text;background-clip:text;color:transparent}
      .matchingDemoShell{border-radius:8px;background:#0d0d0c;box-shadow:0 50px 120px rgba(17,16,14,.22),0 0 0 1px rgba(185,164,134,.12);transform:translateZ(0)}
      .matchingDemoTop{background:linear-gradient(180deg,rgba(255,255,255,.035),transparent);height:58px;align-items:center}
      .matchingDemoBody{background:#0f0f0e}
      .matchingDemoSide{background:linear-gradient(180deg,#11110f,#0c0c0b)}
      .demoSteps b{padding:8px 9px;border-radius:6px;transition:all .25s ease}
      .demoSteps b.active{background:rgba(185,164,134,.09);box-shadow:inset 2px 0 #b9a486}
      .demoProfile{border-radius:8px;background:linear-gradient(135deg,#20201c 0%,#11110f 70%);box-shadow:inset 0 1px rgba(255,255,255,.05),0 28px 70px rgba(0,0,0,.2)}
      .demoProfile:hover{transform:translateY(-4px);border-color:rgba(185,164,134,.3)}
      .demoAvatar{box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 25px 70px rgba(0,0,0,.3)}
      .demoProfile.matched{box-shadow:0 20px 60px rgba(185,164,134,.09),inset 0 0 0 1px rgba(185,164,134,.1)}
      .fullProductDemo{background:var(--paper)}
      .fullProductShell{border-radius:10px;box-shadow:0 45px 110px rgba(17,16,14,.22),0 0 0 1px rgba(185,164,134,.08)}
      .fp-topbar{background:linear-gradient(180deg,#171714,#10100f);height:62px}
      .fp-nav button{transition:all .25s var(--ease)}
      .fp-nav button:hover{transform:translateX(3px);color:#e7dac5}
      .fp-nav button.active{box-shadow:inset 2px 0 #b9a486;background:rgba(185,164,134,.08)}
      .fp-profile{border-radius:8px;background:linear-gradient(135deg,#1c1c19,#0f0f0e);box-shadow:0 25px 70px rgba(0,0,0,.22)}
      .fp-profile:hover{transform:translateY(-4px)}
      .fp-actions button,.fp-filter,.fp-settingsgrid button,.fp-safetygrid button,.fp-settingrows button{transition:all .25s var(--ease)}
      .fp-actions button:hover,.fp-settingsgrid button:hover,.fp-safetygrid button:hover,.fp-settingrows button:hover{transform:translateY(-2px);border-color:rgba(185,164,134,.4)}
      .fp-actions .primary{box-shadow:0 12px 35px rgba(185,164,134,.12)}
      .launchSection{background:radial-gradient(circle at 50% 50%,rgba(185,164,134,.16),transparent 40%),#11110f}
      .launchInner{position:relative}
      .launchInner:before{content:"NEXA / UNIVERSAL MATCHING";position:absolute;top:-42px;left:50%;transform:translateX(-50%);font-size:7px;letter-spacing:.28em;color:rgba(255,255,255,.24);white-space:nowrap}
      .landingFooter{background:#0b0b0a}
      .fp-filterbar{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 40px rgba(0,0,0,.14);backdrop-filter:blur(10px)}
      .fp-filterbar button{transition:all .22s var(--ease);border:1px solid transparent}
      .fp-filterbar button:hover{border-color:rgba(185,164,134,.32);transform:translateY(-1px)}
      .fp-filterbar button.selected{box-shadow:0 8px 24px rgba(185,164,134,.1)}
      .fp-list article{transition:transform .25s var(--ease),border-color .25s ease,background .25s ease}
      .fp-list article:hover{transform:translateX(4px);border-color:rgba(185,164,134,.25);background:rgba(255,255,255,.025)}
      .fp-chat{box-shadow:inset 0 1px rgba(255,255,255,.035)}
      .fp-compose input:focus{outline:none;border-color:rgba(185,164,134,.5);box-shadow:0 0 0 3px rgba(185,164,134,.08)}
      .fp-compose button{transition:all .22s var(--ease)}
      .fp-compose button:hover{transform:translateY(-1px);box-shadow:0 10px 25px rgba(185,164,134,.12)}
      .fp-own{background:linear-gradient(135deg,rgba(185,164,134,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);border-radius:10px}
      .fp-safe{box-shadow:0 0 0 1px rgba(185,164,134,.18),0 8px 24px rgba(185,164,134,.08)}
      .fp-regioncards span{transition:transform .25s var(--ease),border-color .25s ease}
      .fp-regioncards span:hover{transform:translateY(-2px);border-color:rgba(185,164,134,.3)}
      .fp-settingrows button b,.fp-settingsgrid button b{color:#d9c6a6}
      @media(max-width:900px){.salesHero{min-height:auto}.matchingDemoBody{grid-template-columns:1fr}.matchingDemoSide{display:none}.demoProfile{grid-template-columns:160px 1fr auto}}
      @media(max-width:620px){.salesHero{padding-top:120px}.demoProfile{grid-template-columns:1fr;text-align:center}.demoAvatar{margin:auto}.demoProfile .fp-tags,.demoProfile .fp-actions{justify-content:center}.matchingDemoHeader{display:block}.matchingDemoHeader p{margin-top:24px}.launchInner:before{font-size:5px}}
      @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.useCaseGrid article,.featureList article,.customCard,.safetyPoints span,.demoProfile{transition:none}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing.tsx"></script>
    <script>
      (()=>{
        const categoryTarget={恋愛:'M',友だち:'N',仕事:'A',趣味:'L'};
        const find=(s)=>document.querySelector(s);
        const syncCandidate=(initial,tries=0)=>{
          const avatar=find('.fp-avatar span');
          if(!avatar)return;
          if(avatar.textContent===initial)return;
          const next=find('.fp-actions button:nth-child(3)');
          if(!next||tries>4)return;
          next.click();
          setTimeout(()=>syncCandidate(initial,tries+1),80);
        };
        const openModal=(title,body,actions=[])=>{
          let modal=document.getElementById('nexaDemoModal');
          if(!modal){
            modal=document.createElement('div');
            modal.id='nexaDemoModal';
            modal.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(8,8,7,.72);backdrop-filter:blur(12px);opacity:0;transition:opacity .22s ease';
            document.body.appendChild(modal);
          }
          modal.innerHTML=`<div style="width:min(520px,100%);border:1px solid rgba(185,164,134,.24);border-radius:14px;background:linear-gradient(145deg,#1a1916,#0d0d0c);color:#f5f1e8;box-shadow:0 35px 100px rgba(0,0,0,.5);padding:28px"><div style="display:flex;justify-content:space-between;gap:20px;align-items:flex-start"><div><span style="font-size:10px;letter-spacing:.22em;color:#b9a486">NEXA DEMO FLOW</span><h3 style="margin:8px 0 0;font-size:24px;font-weight:500">${title}</h3></div><button data-close-modal style="border:1px solid rgba(255,255,255,.12);background:transparent;color:#f5f1e8;border-radius:999px;width:34px;height:34px">×</button></div><div style="margin-top:22px;color:rgba(245,241,232,.72);line-height:1.8;font-size:14px">${body}</div><div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:24px">${actions.map((x,i)=>`<button data-modal-action="${i}" style="border:1px solid rgba(185,164,134,.28);background:${i===0?'#b9a486':'transparent'};color:${i===0?'#11110f':'#f5f1e8'};padding:11px 16px;border-radius:999px">${x}</button>`).join('')}</div></div>`;
          modal.style.opacity='1';
          modal.onclick=e=>{if(e.target===modal||e.target.closest('[data-close-modal]'))modal.remove();if(e.target.closest('[data-modal-action]'))modal.remove();};
        };
        const start=()=>{
          document.addEventListener('click',e=>{
            const filter=e.target.closest('.fp-filterbar button');
            if(filter){
              const label=filter.textContent.trim();
              if(categoryTarget[label])setTimeout(()=>syncCandidate(categoryTarget[label]),40);
              return;
            }
            const button=e.target.closest('.fp-settingsgrid button,.fp-safetygrid button,.fp-settingrows button');
            if(!button)return;
            const text=button.textContent.trim();
            if(text.includes('安全モード'))return;
            let title='設定';let body='この項目をデモ画面内で確認できます。実運用では購入者のブランド設定やサービスルールに合わせて内容を変更できます。';let actions=['閉じる'];
            if(text.includes('プロフィールを編集')){title='プロフィールを編集';body='表示名、役割、地域、自己紹介、興味タグなどをこの画面から編集する想定です。';actions=['編集を開始','閉じる'];}
            else if(text.includes('公開範囲')){title='公開範囲';body='プロフィールの公開範囲を「公開」「マッチした相手のみ」「非公開」などから設定できます。';actions=['公開','マッチした相手のみ','閉じる'];}
            else if(text.includes('本人確認')){title='本人確認';body='本人確認ステータスと確認方法を表示するフローです。購入者側で必要な認証方式へ差し替えられる設計です。';actions=['確認内容を見る','閉じる'];}
            else if(text.includes('写真・ギャラリー')){title='写真・ギャラリー';body='プロフィール画像やギャラリーを管理する画面です。掲載順、公開範囲、削除などを追加できます。';actions=['ギャラリーを開く','閉じる'];}
            else if(text.includes('ブロック')){title='ブロック';body='この相手を候補、マッチ、メッセージ一覧から非表示にする確認フローです。';actions=['ブロックする','キャンセル'];}
            else if(text.includes('通報')){title='通報';body='通報理由を選択し、必要に応じて補足情報を添えて送信する安全フローです。';actions=['不適切な内容','迷惑行為','なりすまし','キャンセル'];}
            else if(text.includes('プライバシー')){title='プライバシー';body='位置情報、プロフィール公開範囲、通知などのプライバシー設定をまとめて管理できます。';actions=['設定を確認','閉じる'];}
            else if(text.includes('通知設定')){title='通知設定';body='マッチ、メッセージ、安全通知など、通知カテゴリごとに受信方法を設定できます。';actions=['通知を確認','閉じる'];}
            else if(text.includes('表示・アクセシビリティ')){title='表示・アクセシビリティ';body='文字サイズ、コントラスト、モーションなど、利用者に合わせた表示設定を想定しています。';actions=['表示設定を確認','閉じる'];}
            else if(text.includes('アカウント')){title='アカウント';body='アカウント情報、セッション、削除などの管理画面へ進む想定です。';actions=['アカウントを管理','閉じる'];}
            else return;
            e.preventDefault();e.stopPropagation();openModal(title,body,actions);
          },true);
        };
        if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
      })();
    </script>
  </body>
</html>
