<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA — Universal Matching Platform Demo</title><style>html,body{margin:0;height:100%;background:#080a0e}iframe{display:block;width:100%;height:100%;border:0}.panel{position:fixed;z-index:40;border:1px solid #29303b;border-radius:14px;background:#11151cf5;box-shadow:0 14px 40px #0008;color:#f5f4ef;font:12px system-ui;overflow:hidden;backdrop-filter:blur(12px)}#progress{left:18px;bottom:18px;width:min(300px,calc(100vw - 36px))}#activity{right:18px;top:18px;width:min(360px,calc(100vw - 36px))}#mutual{right:18px;bottom:18px;width:min(360px,calc(100vw - 36px));transform:translateY(calc(-100% - 18px))}.head{padding:11px 14px;border-bottom:1px solid #29303b;font-weight:800}.body{padding:10px 14px}.btn{padding:7px 9px;border:1px solid #29303b;background:#171c25;color:#fff;border-radius:8px;cursor:pointer}.primary{border-color:#d9bd7d;background:#d9bd7d;color:#17140e;font-weight:800}.row{display:flex;flex-wrap:wrap;gap:6px}@media(max-width:700px){#progress{left:10px;bottom:10px;width:min(270px,calc(100vw - 20px))}#activity{right:10px;top:10px;width:min(300px,calc(100vw - 20px))}#mutual{right:10px;bottom:10px;width:min(320px,calc(100vw - 20px));transform:translateY(calc(-100% - 10px))}}</style></head><body><iframe id="frame" src="/demo-v5.html" title="NEXA Universal Matching Platform Demo"></iframe><script>
const frame=document.getElementById('frame');let timer=null,boot=0,events=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bootDemo(){const w=frame.contentWindow,d=w.document;if(!w.S||!w.P)return;boot++;events=[];clearInterval(timer);d.querySelectorAll('#progress,#activity,#mutual').forEach(x=>x.remove());
const p=d.createElement('div');p.id='progress';p.className='panel';p.innerHTML='<div class="head">デモ体験ステータス <span id="pc" style="float:right;color:#d9bd7d"></span></div><div class="body" id="pb"></div><button class="btn primary" id="pn" style="display:block;margin:0 14px 12px;width:calc(100% - 28px)"></button><button class="btn" id="pr" style="display:none;margin:0 14px 12px;width:calc(100% - 28px)">デモを最初からやり直す</button>';d.body.appendChild(p);
const a=d.createElement('div');a.id='activity';a.className='panel';a.innerHTML='<div class="head">ライブアクティビティ</div><div class="body"><div id="as" style="color:#9da5b2;line-height:1.55">MATCH・メッセージ・安全操作をここに反映します。</div><div id="al" style="margin-top:9px;display:grid;gap:5px"></div><div id="aa" class="row" style="margin-top:9px"></div><div style="margin-top:10px;border-top:1px solid #29303b;padding-top:9px"><button class="btn" id="ft" style="width:100%;text-align:left">全機能ショートカット ＋</button><div id="fl" class="row" style="display:none;margin-top:7px"></div></div></div>';d.body.appendChild(a);
const m=d.createElement('div');m.id='mutual';m.className='panel';m.innerHTML='<div class="head">デモ用・相互MATCH操作</div><div class="body"><div style="color:#9da5b2;line-height:1.5;margin-bottom:9px">候補ごとに相手側のLIKEを再現できます。LIKE後に相互MATCHを成立させます。</div><div id="mb" class="row"></div><button class="btn primary" id="ma" style="margin-top:8px;width:100%">全員からLIKEを受け取る</button></div>';d.body.appendChild(m);
const steps=[['user','ユーザー設定'],['profile','プロフィール'],['discover','条件検索'],['detail','プロフィール確認'],['liked','LIKE'],['matches','相互MATCH'],['messages','メッセージ'],['safety','安心・安全']];
const counts=()=>({liked:w.S.liked.size,matched:w.S.matches.size,messages:Object.values(w.S.msg||{}).reduce((n,x)=>n+(Array.isArray(x)?x.length:0),0),reported:w.S.reported.size,blocked:w.S.blocked.size,notes:w.S.notes});
let prev=counts();
function safety(){const x=w.P.find(x=>!w.S.blocked.has(x.id)&&!w.S.reported.has(x.id));if(x){w.report(x.id)}w.go('safety')}
function send(){w.go('messages');setTimeout(()=>{const i=d.getElementById('message');if(i&&w.S.matches.size){i.value='こんにちは！デモでマッチングできました。';w.send()}},80)}
function progress(){const c=counts(),liked=c.liked>0,matched=c.matched>0,mess=c.messages>0,searchUsed=w.S.discoveryVisited||w.S.q.trim().length>0||w.S.cat!=='すべて'||w.S.region!=='日本',done={user:w.S.started,profile:w.S.started&&!!w.S.user.name,discover:searchUsed,detail:w.S.view==='detail'||liked||matched,liked,matches:matched,messages:mess,safety:c.reported>0||c.blocked>0};const i=steps.findIndex(([k])=>!done[k]);d.getElementById('pc').textContent=i<0?'COMPLETE':'STEP '+(i+1)+'/8';d.getElementById('pb').innerHTML=i<0?'<div style="color:#73d5aa;font-weight:800;font-size:14px">8/8 完了</div><div style="color:#cbd1da;line-height:1.6;margin-top:6px">主要なMATCH体験を完了しました。ここから下のショートカットで全機能を自由に確認できます。</div>':steps.map(([k,l],n)=>'<div style="display:flex;gap:8px;align-items:center;padding:5px 0;color:'+(done[k]?'#f5f4ef':'#69717d')+'"><span style="width:19px;height:19px;border-radius:50%;display:grid;place-items:center;border:1px solid '+(done[k]?'#73d5aa':'#29303b')+'">'+(done[k]?'✓':n+1)+'</span>'+l+'</div>').join('');const next=d.getElementById('pn'),reset=d.getElementById('pr');if(i<0){next.style.display='none';reset.style.display='block';d.getElementById('ft').textContent='全機能ショートカットを開く ＋';d.getElementById('fl').style.display='flex'}else{reset.style.display='none';next.style.display='block';d.getElementById('ft').textContent='全機能ショートカット ＋';next.textContent=steps[i][1]+'へ進む →';next.onclick=()=>{const t=steps[i][0];if(t==='user')w.start();else if(t==='profile')w.go('profile');else if(t==='discover')w.go('discover');else if(t==='detail'){const x=w.P.find(x=>!w.S.blocked.has(x.id));if(x)w.go('detail',x.id)}else if(t==='liked'){const x=w.P.find(x=>!w.S.blocked.has(x.id));if(x)w.like(x.id)}else if(t==='matches'){const x=w.P.find(x=>w.S.liked.has(x.id)&&w.S.incoming.has(x.id));if(x)w.mutual(x.id)}else if(t==='messages')send();else safety()}};reset.onclick=()=>{boot=0;w.location.reload()}}
function activity(){const c=counts(),as=d.getElementById('as');if(c.matched>prev.matched){as.textContent='MATCH成立。会話が解放されました。';events.unshift('MATCH成立 → 会話を利用できます。')}else if(c.messages>prev.messages){as.textContent='メッセージ送信を検知。会話履歴に反映されています。';events.unshift('メッセージ送信 → 会話履歴へ反映。')}else if(c.reported>prev.reported){as.textContent='通報を管理キューへ送信しました。';events.unshift('通報 → 安全管理キューへ送信。')}else if(c.blocked>prev.blocked){as.textContent='ブロックを反映。候補一覧から除外しました。';events.unshift('ブロック → 候補一覧から除外。')}else if(c.notes>prev.notes){as.textContent='新しい通知を検知しました。';events.unshift('通知更新 → 通知センターを確認できます。')}else if(c.matched)as.textContent=`MATCH ${c.matched}件・メッセージ ${c.messages}件`;events=events.slice(0,3);d.getElementById('al').innerHTML=events.map(x=>'<div style="padding:6px 8px;border-radius:7px;background:#171c25;color:#cbd1da">'+esc(x)+'</div>').join('');const aa=d.getElementById('aa');aa.innerHTML='';const act=(label,fn,primary=false)=>{const b=d.createElement('button');b.textContent=label;b.className='btn'+(primary?' primary':'');b.onclick=fn;aa.appendChild(b)};if(c.matched)act('マッチ一覧を見る',()=>w.go('matches'));if(c.messages)act('メッセージを見る',()=>w.go('messages'));if(c.reported||c.blocked)act('安心・安全を見る',()=>w.go('safety'));if(c.notes>3)act('通知を見る（更新あり）',()=>w.go('notifications'));if(c.matched&&!c.messages)act('サンプルメッセージを送信',send,true);if(!c.reported&&!c.blocked)act('安全操作を体験（通報）',safety,true);prev=c}
[['探す','discover'],['マッチ','matches'],['メッセージ','messages'],['通知','notifications'],['プロフィール','profile'],['安心・安全','safety'],['地域・言語','global'],['設定','settings'],['管理・分析','admin'],['Quick Launch','launch']].forEach(([l,t])=>{const b=d.createElement('button');b.textContent=l;b.className='btn';b.onclick=()=>w.go(t);d.getElementById('fl').appendChild(b)});d.getElementById('ft').onclick=()=>{const x=d.getElementById('fl');x.style.display=x.style.display==='none'?'flex':'none';d.getElementById('ft').textContent=x.style.display==='none'?'全機能ショートカット ＋':'全機能ショートカットを閉じる −'};
w.P.forEach(x=>{const b=d.createElement('button');b.textContent=x.name;b.className='btn';b.setAttribute('aria-label',x.name+'からLIKEを受け取る');b.onclick=()=>{w.S.incoming.add(x.id);w.S.notes++;w.render();w.toast(x.name+'からのLIKEを受け取りました')};d.getElementById('mb').appendChild(b)});d.getElementById('ma').onclick=()=>{w.P.forEach(x=>w.S.incoming.add(x.id));w.S.notes+=w.P.length;w.render();w.toast('全候補からLIKEを受け取りました')};progress();activity();timer=setInterval(()=>{if(frame.contentWindow!==w||!d.body.contains(p)){clearInterval(timer);return}progress();activity()},350)}
frame.addEventListener('load',bootDemo);</script></body></html>
