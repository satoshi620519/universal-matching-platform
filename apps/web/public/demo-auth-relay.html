<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>NEXA Auth Relay</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="target" src="/demo-v7.html" title="NEXA Universal Matching Platform Demo"></iframe><script>(()=>{const target=document.getElementById('target');let last=null;function relay(message){if(!message||message.channel!=='nexa-demo-auth')return;last=message;const send=frame=>{if(!frame)return;try{frame.postMessage(message,location.origin);for(let i=0;i<frame.frames.length;i++)send(frame.frames[i])}catch(_){}};send(target.contentWindow)}window.addEventListener('message',event=>{const message=event.data;if(!message||message.channel!=='nexa-demo-auth')return;if(message.type==='auth:open'||message.type==='auth:logout'){try{window.parent.postMessage(message,location.origin)}catch(_){}return}relay(message)});target.addEventListener('load',()=>{if(last)relay(last)});})();</script></body></html>
