<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>NEXA Auth Relay</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="target" src="/demo-v7.html" title="NEXA Universal Matching Platform Demo"></iframe><script>(()=>{const target=document.getElementById('target');let last=null;function relay(message){if(!message||message.channel!=='nexa-demo-auth'||!target.contentWindow)return;last=message;target.contentWindow.postMessage(message,location.origin)}window.addEventListener('message',event=>relay(event.data));target.addEventListener('load',()=>{if(last)relay(last)});})();</script></body></html>
