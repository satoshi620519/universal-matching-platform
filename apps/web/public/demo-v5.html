<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA — Universal Matching Platform Demo</title><style>:root{--bg:#0b0a08;--surface:#11100e;--surface2:#171512;--surface3:#1d1a16;--line:rgba(255,255,255,.10);--line-strong:rgba(255,255,255,.17);--text:#f5f1e8;--muted:rgba(255,255,255,.54);--soft:rgba(255,255,255,.70);--gold:#b9a486;--gold2:#d0b995;--good:#9fc7ae;--bad:#d89a9a}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 78% 0,rgba(185,164,134,.10),transparent 30%),linear-gradient(180deg,#0b0a08 0%,#090807 100%);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.01em}
button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:50;height:74px;padding:0 clamp(18px,4vw,56px);border-bottom:1px solid var(--line);background:rgba(11,10,8,.88);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-weight:500;letter-spacing:.20em;font-size:14px}.brand:before{content:"N";width:32px;height:32px;display:grid;place-items:center;border:1px solid rgba(185,164,134,.7);color:var(--gold2);font:italic 18px Georgia,serif}.brand small{display:block;color:rgba(255,255,255,.36);font-size:7px;letter-spacing:.18em;margin-top:4px;font-weight:400}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line-strong);background:transparent;color:var(--soft);border-radius:2px;padding:10px 15px;transition:.2s}.btn:hover{border-color:rgba(185,164,134,.55);color:#fff;background:rgba(185,164,134,.07);transform:translateY(-1px)}.primary{background:var(--gold);color:#14110d;border-color:var(--gold);font-weight:600}.primary:hover{background:var(--gold2);color:#111;border-color:var(--gold2)}.danger{color:var(--bad)}
.layout{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:calc(100vh - 74px)}aside{padding:26px 14px;border-right:1px solid var(--line);background:rgba(12,11,9,.78);position:sticky;top:74px;height:calc(100vh - 74px);overflow:auto}.nav button{width:100%;border:0;border-left:2px solid transparent;background:none;color:rgba(255,255,255,.48);text-align:left;padding:13px 14px;margin:2px 0;border-radius:0;transition:.2s}.nav button:hover,.nav button.active{background:rgba(185,164,134,.075);color:#f4eee2;border-left-color:var(--gold)}.main{max-width:1380px;width:100%;margin:auto;padding:42px clamp(20px,4vw,62px) 70px}.hero,.card,.profile,.panel{border:1px solid var(--line);background:linear-gradient(145deg,rgba(25,22,18,.98),rgba(15,14,12,.98));border-radius:2px;box-shadow:0 18px 50px rgba(0,0,0,.13)}.hero{padding:48px clamp(24px,5vw,64px);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-120px;bottom:-170px;width:440px;height:440px;border-radius:50%;border:1px solid rgba(185,164,134,.12);box-shadow:0 0 0 50px rgba(185,164,134,.025),0 0 0 100px rgba(185,164,134,.018);pointer-events:none}.ey{color:var(--gold);font-size:8px;letter-spacing:.24em}.hero h1{position:relative;z-index:1;font-size:clamp(40px,5.2vw,72px);line-height:.98;letter-spacing:-.055em;font-weight:400;margin:15px 0 20px}.hero p{position:relative;z-index:1;color:var(--muted);line-height:1.9;max-width:760px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.card{padding:22px}.muted{color:var(--muted)}.head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:22px;padding-bottom:17px;border-bottom:1px solid var(--line)}.head h2{margin:0;font-size:34px;font-weight:400;letter-spacing:-.045em}.form{display:grid;gap:13px;max-width:820px}.input,.select,.area{width:100%;padding:13px 14px;border:1px solid var(--line-strong);background:#0b0a08;color:#f5f1e8;border-radius:2px;outline:none}.input:focus,.select:focus,.area:focus{border-color:rgba(185,164,134,.72);box-shadow:0 0 0 2px rgba(185,164,134,.08)}.profiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.profile{overflow:hidden;display:grid;grid-template-columns:220px 1fr;min-height:245px}.avatar{min-height:245px;display:grid;place-items:center;font-size:72px;background:radial-gradient(circle at 50% 34%,#8b7860,#40382e 46%,#181512 76%);color:#eee5d7;font:italic 72px Georgia,serif}.body{padding:24px}.body h3{font-size:28px;font-weight:400;letter-spacing:-.04em;margin:0}.score{color:#d5bf9c;font-weight:500;letter-spacing:.03em}.row{display:flex;gap:10px;justify-content:space-between;align-items:center}.row .btn{flex:1}.tag{display:inline-block;border:1px solid rgba(255,255,255,.13);border-radius:2px;padding:6px 9px;margin:4px 4px 0 0;font-size:9px;color:rgba(255,255,255,.62)}.detail{display:grid;grid-template-columns:minmax(250px,360px) 1fr;gap:16px}.bigavatar{min-height:440px;border:1px solid var(--line);border-radius:2px;display:grid;place-items:center;font-size:120px;background:radial-gradient(circle at 50% 35%,#8b7860,#40382e 48%,#161411 80%);color:#eee5d7;font:italic 120px Georgia,serif}.list{display:grid;gap:10px}.item{border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:2px;padding:17px;display:flex;gap:14px;align-items:center}.mini{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#342e26;color:#eee5d7;border:1px solid rgba(185,164,134,.20)}.grow{flex:1}.chat{display:grid;grid-template-columns:290px minmax(0,1fr);border:1px solid var(--line);border-radius:2px;overflow:hidden;min-height:620px;background:#0e0d0b}.chatnav{padding:14px;border-right:1px solid var(--line)}.chatnav button{width:100%;border:0;background:none;color:rgba(255,255,255,.55);text-align:left;padding:14px;border-radius:2px}.chatnav button:hover,.chatnav button.active{background:rgba(185,164,134,.08);color:#f4eee2}.thread{display:flex;flex-direction:column}.threadhead{padding:20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}.msgs{flex:1;padding:24px;display:flex;flex-direction:column;gap:10px}.msg{max-width:min(70%,520px);padding:12px 15px;border-radius:12px;background:#211d18;color:#d8d0c5}.mine{align-self:flex-end;background:var(--gold);color:#17130e}.compose{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line)}.compose input{flex:1}.notice{padding:15px;border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:2px;margin-bottom:10px}.ok{border-color:rgba(159,199,174,.38)}.bad{border-color:rgba(216,154,154,.38)}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.step{padding:13px;border:1px solid var(--line);border-radius:2px;background:#0e0d0b}.done{border-color:rgba(159,199,174,.42)}.toast{position:fixed;right:22px;bottom:22px;background:#f3ede2;color:#16130f;padding:12px 15px;border-radius:2px;z-index:70;box-shadow:0 16px 40px rgba(0,0,0,.35)}.hidden{display:none}.foot{text-align:center;color:rgba(255,255,255,.28);font-size:8px;margin-top:30px;letter-spacing:.08em}
#app>.top + .layout .main:before{content:"MATCHING / DISCOVER";display:block;color:rgba(185,164,134,.62);font-size:8px;letter-spacing:.22em;margin-bottom:12px}.profiles .profile{transition:transform .2s,border-color .2s,box-shadow .2s}.profiles .profile:hover{transform:translateY(-3px);border-color:rgba(185,164,134,.35);box-shadow:0 22px 55px rgba(0,0,0,.22)}.profile .actions{margin-top:15px}.profile .actions .btn{min-height:42px}.detail .panel{padding:28px!important}.detail .panel>p:first-child{color:var(--gold);letter-spacing:.06em}.chatnav button{border-bottom:1px solid rgba(255,255,255,.05);margin-bottom:3px}.chatnav button:last-child{border-bottom:0}.chatnav button.active{box-shadow:inset 2px 0 0 var(--gold)}.notice strong,.card b{color:#eee5d7}label{color:rgba(255,255,255,.72);font-size:12px}select{appearance:auto}input[type="checkbox"]{accent-color:#b9a486}.actions .btn{white-space:nowrap}
@media(max-width:1050px){.layout{grid-template-columns:190px minmax(0,1fr)}.profile{grid-template-columns:170px 1fr}.avatar{min-height:220px}.profiles{grid-template-columns:1fr}}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.main{padding:30px 20px 55px}.grid{grid-template-columns:1fr 1fr}.detail,.chat{grid-template-columns:1fr}.chatnav{border-right:0;border-bottom:1px solid var(--line)}.steps{grid-template-columns:1fr 1fr}.detail .bigavatar{min-height:300px}}
@media(max-width:600px){.grid{grid-template-columns:1fr}.hero{padding:34px 24px}.top{height:64px;padding:0 16px}.brand{font-size:12px}.brand small{display:none}.actions .btn{padding:9px 10px}.profile{grid-template-columns:1fr}.avatar{min-height:220px}.body{padding:20px}.body h3{font-size:25px}.detail .bigavatar{min-height:250px;font-size:90px}.chat{min-height:520px}.msgs{padding:18px}.msg{max-width:86%}.head h2{font-size:29px}.main{padding-left:16px;padding-right:16px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head><body><div id="app"></div><div id="toast" class="toast hidden"></div><script>
const P=[{id:'mika',name:'Mika',role:'クリエイター',area:'東京',country:'日本',cat:'クリエイター',score:96,initial:'M',bio:'ブランドと映像を組み合わせたプロジェクトを探しています。',tags:['デザイン','映像','共同制作']},{id:'alex',name:'Alex',role:'プロダクトマネージャー',area:'大阪',country:'日本',cat:'ビジネス',score:91,initial:'A',bio:'新規プロダクトを一緒に育てられる仲間を探しています。',tags:['PM','SaaS','事業開発']},{id:'lina',name:'Lina',role:'フリーランサー',area:'京都',country:'日本',cat:'クリエイター',score:98,initial:'L',bio:'海外案件にも対応。専門性の違う人との協業が好きです。',tags:['海外','UI/UX','制作']},{id:'noah',name:'Noah',role:'コミュニティ運営',area:'横浜',country:'日本',cat:'コミュニティ',score:94,initial:'N',bio:'安全で長く続くコミュニティを作っています。',tags:['コミュニティ','運営','安全']}];
const LS=['ブランド','カラー','地域','言語','カテゴリ','プロフィール項目','利用ルール','安全設定','通知設定','法務表示'];const S={view:'home',started:false,liked:new Set(),incoming:new Set(['mika']),matches:new Set(),active:null,blocked:new Set(),reported:new Set(),q:'',cat:'すべて',region:'日本',language:'日本語',safe:true,notes:3,msg:{},user:{name:'Satoshi',role:'クリエイター',bio:'プロダクトとデザインが好きです。'},launch:Array(10).fill(false)};
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const toast=x=>{const e=document.getElementById('toast');e.textContent=x;e.classList.remove('hidden');clearTimeout(window._t);window._t=setTimeout(()=>e.classList.add('hidden'),2200)};function go(v,id=null){if(id)S.active=id;S.view=v;render()}function start(){S.started=true;S.view='user';render()}function candidates(){return P.filter(p=>!S.blocked.has(p.id)&&p.name.toLowerCase().includes(S.q.toLowerCase())&&(S.cat==='すべて'||p.cat===S.cat)&&(S.region==='すべて'||p.country===S.region))}function matched(){return P.filter(p=>S.matches.has(p.id))}function saveUser(){const n=document.getElementById('uname').value.trim();if(!n){toast('名前を入力してください');return}S.user.name=n;go('profile')}function editProfile(){const n=document.getElementById('pname').value.trim(),r=document.getElementById('prole').value.trim(),b=document.getElementById('pbio').value.trim();if(n)S.user.name=n;if(r)S.user.role=r;if(b)S.user.bio=b;toast('プロフィールを保存しました');render()}function like(id){if(S.blocked.has(id))return;S.liked.add(id);toast('いいねを送りました');render()}function mutual(id){if(!S.liked.has(id)){toast('先に「いいね」を送ってください');return}if(!S.incoming.has(id)){toast('相手からのいいね待ちです');return}S.matches.add(id);S.active=id;S.notes++;toast('MATCH成立。会話が解放されました');render()}function block(id){S.blocked.add(id);S.liked.delete(id);S.matches.delete(id);if(S.active===id)S.active=null;S.notes++;toast('ブロックして候補から除外しました');go('discover')}function report(id){S.reported.add(id);S.notes++;toast('通報を管理キューへ送信しました');render()}function send(){const i=document.getElementById('message'),p=matched().find(x=>x.id===S.active);if(!p){toast('MATCH成立後に送信できます');return}const t=i.value.trim();if(!t)return;(S.msg[p.id]??=[]).push({mine:true,text:t});i.value='';render()}function reset(){location.reload()}
function nav(){const a=[['discover','探す'],['matches','マッチ'],['messages','メッセージ'],['notifications','通知'],['profile','プロフィール'],['safety','安心・安全'],['global','地域・言語'],['settings','設定'],['admin','管理・分析'],['launch','Quick Launch']];return a.map(x=>`<button class="${S.view===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} ${x[0]==='notifications'&&S.notes?`· ${S.notes}`:''}</button>`).join('')}function shell(c){document.getElementById('app').innerHTML=`<header class="top"><div class="brand">NEXA<small>UNIVERSAL MATCHING PLATFORM</small></div><div class="actions"><button class="btn" onclick="go('home')">トップ</button><button class="btn" onclick="reset()">リセット</button></div></header><div class="layout"><aside><div class="muted" style="font-size:10px;letter-spacing:.16em;padding:8px">PRODUCT WALKTHROUGH</div><div class="nav">${nav()}</div><div class="notice" style="margin-top:18px;font-size:11px">デモモード<br>架空データのみ使用<br>安全設定：${S.safe?'ON':'OFF'}</div></aside><main class="main">${c}<div class="foot">Demo mode · fictional data · safety-first matching walkthrough</div></main></div>`}
function home(){shell(`<section class="hero"><div class="ey">COMMERCIAL PRODUCT DEMO · WEB / IOS / ANDROID</div><h1>世界中の「出会う」を、<br>ひとつの基盤に。</h1><p>ユーザー設定 → プロフィール → 条件検索 → プロフィール確認 → LIKE → 相互MATCH → マッチ一覧 → メッセージ → 安心・安全まで、実際の操作順で体験できます。</p><div class="actions"><button class="btn primary" onclick="start()">デモを開始する →</button><button class="btn" onclick="go('discover')">先に機能を見る</button></div></section><div class="grid"><div class="card"><b>01 · USER</b><p class="muted">利用者情報を設定して体験を開始。</p></div><div class="card"><b>02 · MATCH</b><p class="muted">プロフィールを確認し、双方のLIKEでMATCH。</p></div><div class="card"><b>03 · SAFETY</b><p class="muted">ブロック・通報・安全設定を統合。</p></div></div>`)}
function user(){shell(`<div class="head"><div><div class="ey">STEP 1 / USER</div><h2>ユーザー設定</h2></div></div><div class="panel" style="padding:22px"><p class="muted">まずデモ利用者を設定します。購入者向け製品では登録・認証基盤に置き換えられる想定です。</p><div class="form"><label>表示名<input id="uname" class="input" value="${esc(S.user.name)}" placeholder="表示名"></label><label>利用目的<select class="select"><option>仕事・共同制作</option><option>コミュニティ</option><option>趣味・交流</option></select></label><button class="btn primary" onclick="saveUser()">ユーザー設定を保存してプロフィールへ →</button></div></div>`)}
function profile(){shell(`<div class="head"><div><div class="ey">STEP 2 / PROFILE</div><h2>プロフィール</h2></div></div><div class="detail"><div class="bigavatar">${esc(S.user.name[0]||'S')}</div><div class="panel" style="padding:22px"><div class="form"><label>名前<input id="pname" class="input" value="${esc(S.user.name)}"></label><label>肩書き<input id="prole" class="input" value="${esc(S.user.role)}"></label><label>自己紹介<textarea id="pbio" class="area" rows="5">${esc(S.user.bio)}</textarea></label><button class="btn primary" onclick="editProfile()">プロフィールを保存</button><button class="btn" onclick="go('discover')">条件検索へ進む →</button></div></div></div>`)}
function discover(){S.discoveryVisited=true;shell(`<div class="head"><div><div class="ey">STEP 3 / DISCOVER</div><h2>条件検索</h2></div></div><div class="panel" style="padding:16px"><div class="form"><label>名前で検索<input id="search" class="input" value="${esc(S.q)}" placeholder="名前で検索" onkeydown="if(event.key==='Enter'){S.q=this.value.trim();render()}"></label><div class="grid" style="margin-top:0"><label>カテゴリ<select class="select" onchange="S.cat=this.value;render()"><option>すべて</option><option ${S.cat==='クリエイター'?'selected':''}>クリエイター</option><option ${S.cat==='ビジネス'?'selected':''}>ビジネス</option><option ${S.cat==='コミュニティ'?'selected':''}>コミュニティ</option></select></label><label>地域<select class="select" onchange="S.region=this.value;render()"><option ${S.region==='日本'?'selected':''}>日本</option><option>すべて</option></select></label></div><div class="actions"><button class="btn primary" onclick="S.q=document.getElementById('search').value.trim();render()">検索する</button><button class="btn" onclick="S.q='';S.cat='すべて';S.region='日本';render()">条件をリセット</button></div></div></div><div class="profiles">${candidates().map(p=>`<article class="profile"><div class="avatar">${p.initial}</div><div class="body"><div class="row"><h3>${p.name}</h3><span class="score">${p.score}%</span></div><p>${p.role} · ${p.area}</p><p class="muted">${p.bio}</p>${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}<div class="actions" style="margin-top:12px"><button class="btn" onclick="go('detail','${p.id}')">プロフィールを見る</button><button class="btn primary" onclick="like('${p.id}')">${S.liked.has(p.id)?'LIKE済み':'LIKE'}</button></div></div></article>`).join('')||'<div class="notice">条件に一致する候補がありません。</div>'}</div>`)}
function detail(id){const p=P.find(x=>x.id===id);if(!p)return discover();shell(`<div class="head"><div><div class="ey">STEP 4 / PROFILE DETAIL</div><h2>${p.name}</h2></div><span class="score">MATCH SCORE ${p.score}%</span></div><div class="detail"><div class="bigavatar">${p.initial}</div><div class="panel" style="padding:22px"><p>${p.role} · ${p.area} · ${p.country}</p><p>${p.bio}</p><div>${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="like('${p.id}')">${S.liked.has(p.id)?'LIKE済み':'LIKEする'}</button><button class="btn" onclick="mutual('${p.id}')">相互MATCHを成立させる</button><button class="btn danger" onclick="block('${p.id}')">ブロック</button><button class="btn danger" onclick="report('${p.id}')">通報</button></div></div></div>`)}
function matches(){const ms=matched();shell(`<div class="head"><div><div class="ey">STEP 6 / MATCHES</div><h2>マッチ一覧</h2></div></div><div class="list">${ms.map(p=>`<div class="item"><div class="mini">${p.initial}</div><div class="grow"><b>${p.name}</b><div class="muted">相互MATCH成立 · ${p.role}</div></div><button class="btn primary" onclick="go('messages','${p.id}')">会話を開く</button></div>`).join('')||'<div class="notice">まだMATCHはありません。候補からLIKEを送り、相互LIKEを成立させてください。</div>'}</div>`)}
function messages(){const ms=matched();if(!ms.length)return shell('<div class="notice"><h2>メッセージ</h2><p class="muted">MATCH成立後に会話できます。</p></div>');if(!S.active||!S.matches.has(S.active))S.active=ms[0].id;const p=ms.find(x=>x.id===S.active)||ms[0];shell(`<div class="head"><div><div class="ey">STEP 7 / MESSAGES</div><h2>メッセージ</h2></div></div><div class="chat"><div class="chatnav">${ms.map(x=>`<button class="${x.id===p.id?'active':''}" onclick="go('messages','${x.id}')"><div class="row"><b>${x.name}</b><span>${x.initial}</span></div></button>`).join('')}</div><div class="thread"><div class="threadhead"><b>${p.name}</b><div class="muted">${p.role} · 安全な会話</div></div><div class="msgs">${(S.msg[p.id]||[]).map(m=>`<div class="msg ${m.mine?'mine':''}">${esc(m.text)}</div>`).join('')||'<div class="muted">まだメッセージはありません。デモ用メッセージを送ってみましょう。</div>'}</div><div class="compose"><input id="message" class="input" placeholder="メッセージを入力" onkeydown="if(event.key==='Enter')send()"><button class="btn primary" onclick="send()">送信</button></div></div></div>`)}
function notifications(){shell(`<div class="head"><div><div class="ey">NOTIFICATIONS</div><h2>通知</h2></div></div><div class="notice ok">新しいLIKE：${S.incoming.size}件</div><div class="notice">MATCH成立：${S.matches.size}件 · 未読通知：${S.notes}件</div><div class="actions"><button class="btn primary" onclick="S.notes=0;render()">通知を確認済みにする</button></div>`)}function safety(){shell(`<div class="head"><div><div class="ey">STEP 8 / SAFETY</div><h2>安心・安全</h2></div></div><div class="grid"><div class="card"><b>安全モード</b><p>${S.safe?'ON':'OFF'}</p><button class="btn" onclick="S.safe=!S.safe;render()">切り替える</button></div><div class="card"><b>通報</b><p>${S.reported.size}件</p></div><div class="card"><b>ブロック</b><p>${S.blocked.size}件</p></div></div><div class="notice" style="margin-top:16px">不審な相手は通報・ブロックできます。通報内容は管理キューへ連携される想定です。</div>`)}function global(){shell(`<div class="head"><div><div class="ey">GLOBALIZATION</div><h2>地域・言語</h2></div></div><div class="card"><p>現在の地域：${S.region}</p><p>表示言語：${S.language}</p><button class="btn" onclick="S.region=S.region==='日本'?'すべて':'日本';render()">地域を切り替える</button></div>`)}function settings(){shell(`<div class="head"><div><div class="ey">SETTINGS</div><h2>設定</h2></div></div><div class="card"><p>安全モード：${S.safe?'ON':'OFF'}</p><p>通知：${S.notes}件</p><button class="btn" onclick="S.safe=!S.safe;render()">安全モード切替</button></div>`)}function admin(){shell(`<div class="head"><div><div class="ey">ADMIN / ANALYTICS</div><h2>管理・分析</h2></div></div><div class="grid"><div class="card"><b>${P.length}</b><p class="muted">候補ユーザー</p></div><div class="card"><b>${S.liked.size}</b><p class="muted">LIKE</p></div><div class="card"><b>${S.matches.size}</b><p class="muted">MATCH</p></div><div class="card"><b>${S.reported.size}</b><p class="muted">通報</p></div></div>`)}function launch(){shell(`<div class="head"><div><div class="ey">BUYER QUICK LAUNCH</div><h2>Quick Launch</h2></div></div><p class="muted">購入者がブランド・地域・安全設定などを順番に初期設定する想定です。</p><div class="grid">${LS.map((x,i)=>`<label class="card"><input type="checkbox" ${S.launch[i]?'checked':''} onchange="S.launch[${i}]=this.checked;render()"> ${x}</label>`).join('')}</div>`)}function render(){const f={home,user,profile,discover,detail,matches,messages,notifications,safety,global,settings,admin,launch};(f[S.view]||home)()}render();
</script></body></html>
