<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA — Universal Matching Platform Demo</title><style>
:root{--bg:#0b0b0a;--p:#141411;--p2:#1b1a16;--t:#f5f1e8;--m:#888278;--g:#b9a486;--l:rgba(255,255,255,.1);--ok:#8ebf9a;--danger:#c98181}*{box-sizing:border-box}body{margin:0;background:#e9e4da;color:var(--t);font:13px Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{width:min(1450px,calc(100% - 24px));margin:22px auto;background:var(--bg);border:1px solid #292722;border-radius:14px;overflow:hidden;box-shadow:0 30px 90px #0003}.top{height:64px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{letter-spacing:.16em;display:flex;gap:10px;align-items:center}.mark{border:1px solid var(--g);color:var(--g);width:30px;height:30px;display:grid;place-items:center}.badge{font-size:9px;color:var(--g);letter-spacing:.15em}.body{display:grid;grid-template-columns:225px 1fr;min-height:790px}.side{border-right:1px solid var(--l);padding:18px 12px;display:flex;flex-direction:column}.side small{color:#555;letter-spacing:.18em;margin:8px 12px}.side button{border:0;background:none;color:#777;text-align:left;padding:11px 12px;border-radius:7px;display:flex;gap:10px;align-items:center}.side button:hover,.side button.active{background:#b9a48614;color:#eee}.side i{font-style:normal;color:var(--g);width:18px}.side b{margin-left:auto;background:var(--g);color:#111;border-radius:9px;font-size:9px;padding:2px 6px}.side .sep{border-top:1px solid var(--l);margin:12px 0}.foot{margin-top:auto;border-top:1px solid var(--l);padding:15px 12px;color:#555;font-size:9px}.foot strong{color:var(--ok);font-weight:400}.content{padding:36px 42px;background:radial-gradient(circle at 80% 0,#b9a48614,transparent 35%)}h1{font-size:31px;font-weight:400;margin:6px 0 20px;letter-spacing:-.04em}.ey{color:var(--g);font-size:9px;letter-spacing:.2em}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.tools{display:flex;gap:7px}.input,.select,.field input,.field select,.field textarea{background:#171613;border:1px solid var(--l);color:#ddd;padding:11px;border-radius:6px;outline:0}.input{width:100%}.btn{border:1px solid #b9a48666;background:none;color:#cdbb9f;padding:10px 13px;border-radius:6px;font-size:11px}.btn:hover{background:#b9a48612}.primary{background:var(--g);color:#111;border-color:var(--g)}.danger{color:#d99a9a;border-color:#c9818166}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.filters button{border:1px solid var(--l);background:none;color:#888;padding:8px 12px;border-radius:999px}.filters button.active{background:var(--g);color:#111}.candidate{display:grid;grid-template-columns:145px 1fr auto;gap:25px;align-items:center;border:1px solid var(--l);border-radius:10px;padding:25px;background:linear-gradient(135deg,#1d1d19,#10100f);position:relative}.avatar,.mavatar{display:grid;place-items:center;background:radial-gradient(circle,#8b7962,#292721);font-family:Georgia;font-style:italic}.avatar{width:140px;height:140px;border-radius:50%;font-size:65px}.mavatar{width:45px;height:45px;border-radius:50%;font-size:20px}.name{font-size:46px}.sub,.muted{color:#777;font-size:11px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.tags span{border:1px solid var(--l);padding:6px 9px;color:#999;font-size:9px}.score{text-align:right}.score strong{display:block;color:#d2bd9c;font-size:42px;font-weight:400}.actions{display:flex;gap:7px;justify-content:center;margin:14px 0;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card,.row,.notice,.stat{border:1px solid var(--l);background:#ffffff04;border-radius:7px;padding:17px;color:#aaa}.card{cursor:pointer;text-align:left}.card:hover{border-color:#b9a48655}.card b,.row b,.stat b{color:#ddd;font-weight:400}.card span{display:block;color:#777;font-size:9px;margin-top:6px}.row{display:flex;align-items:center;gap:13px}.grow{flex:1}.chat{min-height:500px;border:1px solid var(--l);border-radius:8px;display:flex;flex-direction:column}.chathead{padding:13px;border-bottom:1px solid var(--l);display:flex;gap:10px;align-items:center}.bubbles{flex:1;padding:20px;display:grid;align-content:start;gap:9px}.bubble{max-width:70%;padding:10px 12px;font-size:11px;line-height:1.6}.them{background:#24231f;color:#bbb}.mine{justify-self:end;background:var(--g);color:#111}.compose{display:flex;border-top:1px solid var(--l)}.compose input{flex:1;background:none;border:0;color:#eee;padding:15px;outline:0}.compose button{border:0;background:var(--g);color:#111;padding:0 17px}.stat strong{display:block;color:#ddd;font-size:23px;margin-top:5px}.field{display:grid;gap:6px;color:#777;font-size:10px}.list{display:grid;gap:8px}.toggle{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--l);background:#ffffff04;color:#aaa;padding:15px;border-radius:7px;text-align:left}.toggle b{color:var(--g);font-weight:400}.bar{height:8px;background:#24231f;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}.timeline{display:grid;gap:0}.step{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--l)}.step em{font-style:normal;color:var(--g)}.modal{position:fixed;inset:0;background:#050504c7;backdrop-filter:blur(10px);z-index:9;display:grid;place-items:center;padding:16px}.modalbox{width:min(680px,100%);max-height:88vh;overflow:auto;background:linear-gradient(145deg,#1a1916,#0d0d0c);border:1px solid #b9a48644;border-radius:12px;padding:24px}.modalhead{display:flex;justify-content:space-between}.modalbody{margin-top:15px;color:#aaa;line-height:1.7}.close{border:1px solid var(--l);background:none;color:#eee;border-radius:50%;width:32px;height:32px}.modalactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}@media(max-width:850px){.body{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(4,1fr);border:0;border-bottom:1px solid var(--l);padding:7px}.side small,.side .sep,.foot{display:none}.side button{justify-content:center;display:grid;gap:3px;text-align:center;font-size:9px;padding:8px}.side b{display:none}.content{padding:24px 17px}.candidate{grid-template-columns:95px 1fr}.avatar{width:95px;height:95px;font-size:45px}.name{font-size:34px}.score{grid-column:2;text-align:left}.grid,.grid3{grid-template-columns:1fr}}@media(max-width:560px){.candidate{grid-template-columns:1fr;text-align:center}.avatar{margin:auto}.score{text-align:center;grid-column:auto}.top .badge{display:none}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><span class="mark">N</span>NEXA</div><span class="badge">UNIVERSAL MATCHING PLATFORM · INTERACTIVE DEMO</span><span id="session">Demo · Satoshi</span></header><div class="body"><aside class="side"><small>MEMBER</small><button data-v="discover" class="active">⌕　探す</button><button data-v="matches">♡　マッチ <b id="mb">0</b></button><button data-v="messages">▱　メッセージ</button><button data-v="notifications">◌　通知 <b id="nb">3</b></button><button data-v="profile">◎　プロフィール</button><button data-v="safety">◇　安心・安全</button><button data-v="global">◍　地域・言語</button><button data-v="settings">⚙　設定</button><div class="sep"></div><small>OPERATOR / BUYER</small><button data-v="admin">▣　管理・分析</button><button data-v="quick">✦　Quick Launch</button><div class="foot">DEMO MODE<br><strong id="status">● 安全モード ON</strong></div></aside><main class="content" id="app"></main></div></div><div id="modal"></div><script>
const P=[{n:'Mika',r:'クリエイター',p:'東京',t:['写真','旅行','デザイン'],s:96,i:'M',o:1,u:'恋愛・友だち'},{n:'Alex',r:'プロダクトマネージャー',p:'大阪',t:['起業','音楽','カフェ'],s:91,i:'A',o:1,u:'仕事・友だち'},{n:'Lina',r:'フリーランサー',p:'京都',t:['アート','旅','コミュニティ'],s:98,i:'L',o:0,u:'趣味・友だち'},{n:'Noah',r:'コミュニティ運営',p:'横浜',t:['読書','イベント','地域'],s:94,i:'N',o:1,u:'コミュニティ・仕事'}];
const S={v:'discover',cat:'すべて',q:'',sort:'相性順',cur:0,liked:[],passed:[],blocked:[],matched:[],msgs:{},notice:3,safe:true,lang:'日本語',region:'日本',public:'公開',verified:true,gallery:6,email:true,push:true,compact:false,onboard:0,features:{matching:true,messaging:true,notifications:true,payment:false,verification:true},schema:['表示名','自己紹介','地域','興味'],terms:{like:'いいね',match:'マッチ'},published:0,history:[],revenue:128000,users:1842,flags:3};
const $=s=>document.querySelector(s), esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function modal(t,b,a=''){ $('#modal').innerHTML=`<div class="modal"><div class="modalbox"><div class="modalhead"><div><span class="ey">NEXA DEMO FLOW</span><h2>${t}</h2></div><button class="close" onclick="closeM()">×</button></div><div class="modalbody">${b}</div><div class="modalactions">${a}<button class="btn" onclick="closeM()">閉じる</button></div></div></div>`}function closeM(){$('#modal').innerHTML=''}
function filtered(){let a=P.map((x,i)=>({...x,i})).filter(x=>!S.blocked.includes(x.i)&&!S.passed.includes(x.i));if(S.q)a=a.filter(x=>`${x.n} ${x.r} ${x.p} ${x.t.join(' ')}`.toLowerCase().includes(S.q.toLowerCase()));if(S.cat!=='すべて')a=a.filter(x=>x.u.includes(S.cat));if(S.sort==='相性順')a.sort((a,b)=>b.s-a.s);if(S.sort==='名前順')a.sort((a,b)=>a.n.localeCompare(b.n));if(S.sort==='新着順')a.sort((a,b)=>b.o-a.o);return a}
function like(i=S.cur){if(!S.liked.includes(i))S.liked.push(i);if(!S.matched.includes(i))S.matched.push(i);render()}function pass(i=S.cur){if(!S.passed.includes(i))S.passed.push(i);S.cur=(i+1)%P.length;render()}function match(i=S.cur){like(i);S.v='matches';render()}function detail(i=S.cur){let p=P[i];modal(`${p.n} のプロフィール`,`<p><strong>${p.s}%</strong> の相性 · ${esc(p.r)} · ${esc(p.p)}</p><div class="tags">${p.t.map(x=>`<span>${x}</span>`).join('')}</div><p>目的：${p.u}<br>オンライン：${p.o?'はい':'最近アクティブ'}</p>`,`<button class="btn primary" onclick="like(${i});closeM()">♡ いいね</button><button class="btn" onclick="match(${i});closeM()">マッチ成立</button><button class="btn danger" onclick="report(${i})">通報</button>`)}
function send(){let e=$('#msg');if(!e||!e.value.trim())return;S.msgs[S.cur]=[...(S.msgs[S.cur]||[]),e.value.trim()];e.value='';render()}function report(i=S.cur){S.flags++;closeM();S.v='safety';render()}
function editProfile(){modal('プロフィール編集',`<div class="grid"><label class="field">表示名<input value="Satoshi"></label><label class="field">役割<input value="クリエイター"></label><label class="field">地域<input value="日本"></label><label class="field">興味<input value="デザイン, プロダクト, 旅行"></label></div><label class="field" style="margin-top:9px">自己紹介<textarea>デザインとプロダクトが好きです。</textarea></label>`,'<button class="btn primary" onclick="closeM();toast(\'保存しました\')">保存する</button>')}function toast(x){modal('操作完了',`<div class="notice">${x}</div>`)}
function visibility(){modal('公開範囲',`<div class="list">${['公開','マッチした相手のみ','非公開'].map(x=>`<button class="toggle" onclick="S.public='${x}';visibility()">${x}<b>${S.public===x?'✓':''}</b></button>`).join('')}</div>`)}
function verification(){modal('本人確認',`<p>現在：<strong>${S.verified?'認証済み ✓':'未確認'}</strong></p><p>実運用では本人確認プロバイダー接続へ置き換え可能です。</p>`,'<button class="btn primary" onclick="S.verified=true;closeM();render()">認証済みにする</button>')}function gallery(){modal('写真・ギャラリー',`<p>公開中 ${S.gallery}枚</p><div class="grid3">${Array.from({length:S.gallery},(_,i)=>`<div class="card" style="text-align:center">写真 ${i+1}</div>`).join('')}</div>`,'<button class="btn primary" onclick="S.gallery++;gallery()">写真を追加</button>')}
function safetyModal(){modal('安全設定',`<div class="list"><button class="toggle" onclick="S.safe=!S.safe;safetyModal()">安全モード <b>${S.safe?'ON':'OFF'}</b></button><button class="toggle" onclick="modal('ブロック確認','現在の候補をブロックします。','<button class="btn danger" onclick="S.blocked.push(S.cur);closeM();render()">ブロックする</button>')">候補をブロック <b>›</b></button><button class="toggle" onclick="report()">通報フロー <b>${S.flags}件</b></button></div>`)}
function renderDiscover(){let a=filtered(),p=P[S.cur];return `<div class="head"><div><span class="ey">DISCOVER</span><h1>あなたに合う相手</h1></div><select class="select" onchange="S.sort=this.value;render()"><option>相性順</option><option>新着順</option><option>名前順</option></select></div><div><input class="input" placeholder="名前・職種・地域・興味で検索" value="${esc(S.q)}" oninput="S.q=this.value;render()"></div><div class="filters">${['すべて','恋愛','友だち','仕事','趣味'].map(x=>`<button class="${S.cat===x?'active':''}" onclick="S.cat='${x}';render()">${x}</button>`).join('')}</div><div class="candidate"><button class="avatar" onclick="detail()">${p.i}<span></span></button><div><span class="ey">${p.o?'● ONLINE':'○ ACTIVE'}</span><div class="name">${p.n}</div><div class="sub">${p.r} · ${p.p} · ${p.u}</div><div class="tags">${p.t.map(x=>`<span>${x}</span>`).join('')}</div></div><div class="score"><strong>${p.s}%</strong>相性</div></div><div class="actions"><button class="btn" onclick="pass()">スキップ</button><button class="btn primary" onclick="like()">${S.matched.includes(S.cur)?'✓ MATCH':'♡ いいね'}</button><button class="btn" onclick="S.cur=(S.cur+1)%P.length;render()">次へ →</button><button class="btn" onclick="detail()">詳細</button></div><div class="grid3"><div class="stat">候補<strong>${P.length}</strong></div><div class="stat">いいね<strong>${S.liked.length}</strong></div><div class="stat">マッチ<strong>${S.matched.length}</strong></div></div><p class="muted">検索結果 ${a.length}件 · 相性/新着/名前で並び替え可能</p>`}
function renderMatches(){let a=P.filter((_,i)=>S.matched.includes(i));return `<div class="head"><div><span class="ey">CONNECTIONS</span><h1>マッチ一覧</h1></div></div><div class="list">${a.map((p,i)=>{let n=P.indexOf(p);return `<div class="row"><i class="mavatar">${p.i}</i><div class="grow"><b>${p.n}</b><div class="muted">${p.r} · ${p.p}</div></div><button class="btn" onclick="S.cur=${n};S.v='messages';render()">メッセージ</button><button class="btn" onclick="S.matched=S.matched.filter(x=>x!==${n});render()">解除</button></div>`}).join('')||'<div class="notice">探す画面からマッチを成立させてください。</div>'}</div>`}
function renderMessages(){let p=P[S.cur],m=S.msgs[S.cur]||[];return `<div class="head"><div><span class="ey">MESSAGES</span><h1>メッセージ</h1></div><button class="btn" onclick="modal('会話オプション','安全な会話・添付・通報を体験できます.','<button class="btn danger" onclick="report()">この会話を通報</button>')">⋯</button></div><div class="chat"><div class="chathead"><i class="mavatar">${p.i}</i><div class="grow"><b>${p.n}</b><div class="muted">${p.o?'オンライン':'最近アクティブ'} · 安全な会話</div></div><button class="btn" onclick="detail()">プロフィール</button></div><div class="bubbles"><div class="bubble them">こんにちは。プロフィールを見てくれてありがとう。</div>${m.map(x=>`<div class="bubble mine">${esc(x)}<small>既読</small></div>`).join('')}</div><div class="compose"><button onclick="modal('メディア送信','画像・ファイル・位置情報の添付UIを体験できます。','<button class="btn primary" onclick="closeM();toast(\'添付しました\')">添付する</button>" )">＋</button><input id="msg" placeholder="メッセージを入力…" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">送信</button></div></div>`}
function renderNotifications(){return `<div class="head"><div><span class="ey">ACTIVITY</span><h1>通知</h1></div><button class="btn" onclick="S.notice=0;render()">すべて既読</button></div><div class="list"><div class="row"><i class="mavatar">♡</i><div class="grow"><b>新しいマッチ</b><div class="muted">Mikaさんとマッチしました。</div></div><span class="muted">たった今</span></div><div class="row"><i class="mavatar">✦</i><div class="grow"><b>おすすめ</b><div class="muted">96%相性の候補があります。</div></div><span class="muted">8分前</span></div><div class="row"><i class="mavatar">✓</i><div class="grow"><b>安全確認</b><div class="muted">安全設定が有効です。</div></div><span class="muted">今日</span></div>${!S.notice?'<div class="notice">すべて確認済みです。</div>':''}</div>`}
function renderProfile(){return `<div class="head"><div><span class="ey">MY PROFILE</span><h1>プロフィール</h1></div></div><div class="card"><div style="display:flex;gap:16px;align-items:center"><div class="avatar" style="width:90px;height:90px;font-size:42px">S</div><div><h2 style="margin:0;font-weight:400">Satoshi</h2><div class="muted">クリエイター · 日本</div><div class="tags"><span>デザイン</span><span>プロダクト</span><span>旅行</span></div></div></div></div><div class="grid" style="margin-top:9px"><button class="card" onclick="editProfile()"><b>プロフィールを編集</b><span>表示名・自己紹介・地域・興味</span></button><button class="card" onclick="visibility()"><b>公開範囲</b><span>${S.public}</span></button><button class="card" onclick="verification()"><b>本人確認</b><span>${S.verified?'認証済み ✓':'未確認'}</span></button><button class="card" onclick="gallery()"><b>写真・ギャラリー</b><span>${S.gallery}枚</span></button></div>`}
function renderSafety(){return `<div class="head"><div><span class="ey">TRUST & SAFETY</span><h1>安心・安全</h1></div></div><div class="grid"><button class="card" onclick="modal('ブロック','現在の候補を非表示にします。','<button class=\'btn danger\' onclick=\'S.blocked.push(S.cur);closeM();render()\'>ブロックする</button>')"><b>ブロック</b><span>候補から非表示</span></button><button class="card" onclick="modal('通報','理由を選択してください。','<button class=\'btn danger\' onclick=\'report()\'>送信する</button>')"><b>通報</b><span>${S.flags}件の運営確認</span></button><button class="card" onclick="S.safe=!S.safe;render()"><b>安全モード</b><span>${S.safe?'ON':'OFF'}</span></button><button class="card" onclick="modal('プライバシー','位置情報：保護<br>正確な位置：非公開<br>公開範囲：'+S.public)"><b>プライバシー</b><span>位置情報・公開範囲</span></button></div>`}
function renderGlobal(){return `<div class="head"><div><span class="ey">GLOBAL</span><h1>地域・言語</h1></div></div><div class="grid"><label class="field">表示言語<select onchange="S.lang=this.value;render()"><option>日本語</option><option>English</option><option>한국어</option><option>中文</option></select></label><label class="field">利用地域<select onchange="S.region=this.value;render()"><option>日本</option><option>米国</option><option>EU</option><option>東南アジア</option></select></label></div><div class="grid3" style="margin-top:10px"><div class="stat">言語<strong>${S.lang}</strong></div><div class="stat">地域<strong>${S.region}</strong></div><div class="stat">タイムゾーン<strong>${S.region==='日本'?'JST':S.region==='米国'?'PST / EST':'UTC'}</strong></div><div class="stat">距離検索<strong>ON</strong></div><div class="stat">位置情報<strong>保護</strong></div><div class="stat">ロケール<strong>${S.lang==='日本語'?'ja-JP':'global'}</strong></div></div>`}
function renderSettings(){return `<div class="head"><div><span class="ey">SETTINGS</span><h1>設定</h1></div></div><div class="list"><button class="toggle" onclick="S.safe=!S.safe;render()">安全モード <b>${S.safe?'ON':'OFF'}</b></button><button class="toggle" onclick="modal('通知設定','メール通知：'+(S.email?'ON':'OFF')+'<br>プッシュ通知：'+(S.push?'ON':'OFF'),'<button class=\'btn primary\' onclick=\'S.email=!S.email;S.push=!S.push;closeM();render()\'>切り替える</button>')">通知設定 <b>${S.email||S.push?'カスタム':'OFF'}</b></button><button class="toggle" onclick="S.compact=!S.compact;render()">表示・アクセシビリティ <b>${S.compact?'コンパクト':'標準'}</b></button><button class="toggle" onclick="modal('アカウント','Demoアカウント Satoshi','<button class=\'btn danger\' onclick=\'$("#session").textContent="Demo session ended";closeM()\'>ログアウト</button>')">アカウント <b>管理</b></button></div>`}
function renderAdmin(){return `<div class="head"><div><span class="ey">OPERATOR CONSOLE</span><h1>管理・分析</h1></div><button class="btn primary" onclick="S.notice++;render()">テスト通知</button></div><div class="grid3"><div class="stat">利用者<strong>${S.users.toLocaleString()}</strong></div><div class="stat">マッチ<strong>${S.matched.length+428}</strong></div><div class="stat">月間売上<strong>¥${S.revenue.toLocaleString()}</strong></div><div class="stat">要確認通報<strong>${S.flags}</strong></div><div class="stat">本人確認<strong>94%</strong></div><div class="stat">稼働率<strong>99.98%</strong></div></div><h3 style="font-weight:400;margin-top:28px">運営フロー</h3><div class="grid"><button class="card" onclick="modal('モデレーションキュー','不適切プロフィール 2件<br>通報 3件<br>自動検知 1件','<button class="btn primary" onclick="S.flags=0;closeM();render()">確認済みにする</button>')"><b>モデレーション</b><span>通報・審査・制限・監査</span></button><button class="card" onclick="modal('決済・収益','決済プロバイダー接続点：Stripe等<br>プラン：Free / Pro / Business<br>課金状態・返金・Webhookを管理できます。')"><b>決済・収益</b><span>決済・プラン・返金・Webhook</span></button><button class="card" onclick="modal('分析','登録 → プロフィール完成 → いいね → マッチ → 会話 のファネルを確認できます。','<button class="btn primary" onclick="closeM()">CSV出力を想定</button>')"><b>分析・レポート</b><span>ファネル・地域・継続率・売上</span></button><button class="card" onclick="modal('ユーザー管理','検索、詳細、停止、復旧、本人確認状態、監査履歴を操作できます。')"><b>ユーザー管理</b><span>状態変更・監査ログ</span></button></div>`}
function qStep(){let steps=['サービス用途','ブランド','地域・言語','カテゴリ','プロフィール項目','マッチングルール','機能ON/OFF','安全・モデレーション','通知','法務・サポート','確認・公開'];return `<div class="head"><div><span class="ey">BUYER QUICK LAUNCH</span><h1>最短で公開</h1></div><span class="muted">${S.onboard}/11 完了</span></div><div class="bar"><i style="width:${S.onboard/11*100}%"></i></div><div class="timeline" style="margin-top:16px">${steps.map((x,i)=>`<div class="step"><em>${i+1}</em><div class="grow"><b style="color:#ddd;font-weight:400">${x}</b><div class="muted">${i<S.onboard?'完了':'設定を体験する'}</div></div>${i===S.onboard&&i<11?`<button class="btn primary" onclick="S.onboard++;render()">設定する</button>`:''}${i<S.onboard?'<span style="color:var(--ok)">✓</span>':''}</div>`).join('')}</div><div class="grid" style="margin-top:18px"><button class="card" onclick="brandSetup()"><b>ブランド設定</b><span>ロゴ・色・名称・画像</span></button><button class="card" onclick="schemaSetup()"><b>プロフィールスキーマ</b><span>${S.schema.length}項目を編集</span></button><button class="card" onclick="featureSetup()"><b>機能・用語</b><span>${Object.values(S.features).filter(Boolean).length}機能ON</span></button><button class="card" onclick="publishSetup()"><b>公開・バージョン</b><span>${S.published?'公開済み v'+S.published:'未公開'}</span></button></div>`}
function brandSetup(){modal('ブランド設定',`<div class="grid"><label class="field">サービス名<input value="NEXA"></label><label class="field">アクセント<input value="#B9A486"></label><label class="field">ロゴ<input value="N"></label><label class="field">キャッチコピー<input value="つながりを、もっと自由に。"></label></div>`,'<button class="btn primary" onclick="closeM();toast(\'ブランド設定を保存しました\')">保存</button>')}function schemaSetup(){modal('プロフィールスキーマ',`<div class="list">${S.schema.map((x,i)=>`<div class="row"><b>${x}</b><button class="btn danger" onclick="S.schema.splice(${i},1);schemaSetup()">削除</button></div>`).join('')}</div>`,'<button class="btn primary" onclick="S.schema.push(\'新しい項目\');schemaSetup()">項目を追加</button>')}function featureSetup(){modal('機能・用語設定',`<div class="list">${Object.keys(S.features).map(k=>`<button class="toggle" onclick="S.features.${k}=!S.features.${k};featureSetup()">${k}<b>${S.features[k]?'ON':'OFF'}</b></button>`).join('')}<div class="notice">用語変更例：${S.terms.like} → 応援、${S.terms.match} → コネクト など、購入者側でサービス名称へ変更できます。</div></div>`)}function publishSetup(){modal('公開・バージョン管理',`<p>現在：${S.published?'v'+S.published+' 公開済み':'未公開'}</p><p>公開版は履歴として固定され、次回編集は新しいバージョンになります。</p><div class="list">${S.history.map(x=>`<div class="row"><b>v${x}</b><span class="muted">公開済み・固定</span></div>`).join('')}</div>`,'<button class="btn primary" onclick="S.published++;S.history.unshift(S.published);closeM();render()">新バージョンを公開</button>')}
function renderQuick(){return qStep()}
function render(){let f={discover:renderDiscover,matches:renderMatches,messages:renderMessages,notifications:renderNotifications,profile:renderProfile,safety:renderSafety,global:renderGlobal,settings:renderSettings,admin:renderAdmin,quick:renderQuick};$('#app').innerHTML=f[S.v]();document.querySelectorAll('.side button[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===S.v));$('#mb').textContent=S.matched.length;$('#nb').textContent=S.notice||'';$('#nb').style.display=S.notice?'':'none';$('#status').textContent=`● 安全モード ${S.safe?'ON':'OFF'}`)}document.querySelectorAll('.side button[data-v]').forEach(b=>b.onclick=()=>{S.v=b.dataset.v;render()});render();
</script></body></html>
