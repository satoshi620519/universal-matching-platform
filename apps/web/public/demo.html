<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXA — Universal Matching Platform Demo</title>
<style>
html,body{margin:0;height:100%;background:#080a0e}iframe{display:block;width:100%;height:100%;border:0}
#auth{position:fixed;top:16px;right:16px;z-index:100;font:14px system-ui;color:#f5f4ef}
#auth button{border:1px solid #d9bd7d;background:#d9bd7d;color:#17140e;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}
#auth .user{display:flex;gap:8px;align-items:center;background:#11151cf5;border:1px solid #29303b;border-radius:12px;padding:8px}
#auth .user button{padding:7px 10px}
#login{position:fixed;inset:0;z-index:110;display:none;place-items:center;background:#000b;font:14px system-ui;color:#f5f4ef;padding:20px}
.dialog{width:min(380px,100%);background:#171b23;border:1px solid #394252;border-radius:16px;padding:24px;box-shadow:0 25px 90px #000}
.dialog h2{margin:0 0 8px}.dialog p{color:#aeb6c3;line-height:1.5}.dialog input{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:12px;border-radius:8px;border:1px solid #394252;background:#0d1118;color:#fff}.dialog .actions{display:flex;gap:8px;margin-top:14px}.dialog button{flex:1;padding:11px;border-radius:8px;border:1px solid #394252;background:#202936;color:#fff;cursor:pointer}.dialog .primary{background:#d9bd7d;color:#17140e;border-color:#d9bd7d;font-weight:700}.error{color:#ffb0b0;min-height:20px;margin-top:8px}
</style>
</head>
<body>
<iframe id="demoFrame" src="/demo-auth-relay.html" title="NEXA Universal Matching Platform Demo"></iframe>
<div id="auth"><button id="openLogin">ログイン</button></div>
<div id="login" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
 <form class="dialog" id="loginForm">
  <h2 id="loginTitle">ログイン</h2><p>登録済みのアカウントでデモに接続します。</p>
  <input id="email" type="email" autocomplete="email" placeholder="メールアドレス" required>
  <input id="password" type="password" autocomplete="current-password" placeholder="パスワード" required>
  <div class="error" id="error" aria-live="polite"></div>
  <div class="actions"><button type="button" id="cancel">キャンセル</button><button class="primary" type="submit">ログインする</button></div>
 </form>
</div>
<script>
(()=>{
 const API='https://universal-matching-platform-api.onrender.com';
 const KEY='nexa.session.credential';
 const CHANNEL='nexa-demo-auth';
 const auth=document.getElementById('auth');const login=document.getElementById('login');const form=document.getElementById('loginForm');const error=document.getElementById('error');const demoFrame=document.getElementById('demoFrame');
 const credential=()=>sessionStorage.getItem(KEY);
 function broadcast(type){const message={channel:CHANNEL,type,authenticated:Boolean(credential())};const send=frame=>{if(!frame)return;frame.postMessage(message,location.origin);try{for(let i=0;i<frame.frames.length;i++)send(frame.frames[i])}catch(_){}};send(demoFrame.contentWindow)}
 function render(){const token=credential();auth.innerHTML=token?'<div class="user"><span>ログイン中</span><button id="logout">ログアウト</button></div>':'<button id="openLogin">ログイン</button>';if(!token)document.getElementById('openLogin').onclick=()=>{error.textContent='';login.style.display='grid';document.getElementById('email').focus()};else document.getElementById('logout').onclick=logout;broadcast(token?'auth:signed-in':'auth:state')}
 async function logout(){const token=credential();try{await fetch(API+'/auth/sign-out',{method:'POST',headers:{Authorization:'Bearer '+token},credentials:'include'})}finally{sessionStorage.removeItem(KEY);render();broadcast('auth:signed-out')}}
 form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const submit=form.querySelector('button[type="submit"]');submit.disabled=true;try{const res=await fetch(API+'/auth/sign-in',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});if(!res.ok)throw new Error('ログインに失敗しました。');const data=await res.json();if(!data.credential)throw new Error('メールアドレスまたはパスワードを確認してください。');sessionStorage.setItem(KEY,data.credential);login.style.display='none';form.reset();render();broadcast('auth:signed-in')}catch(err){error.textContent=err instanceof Error?err.message:'ログインに失敗しました。'}finally{submit.disabled=false}});
 demoFrame.addEventListener('load',()=>broadcast(credential()?'auth:signed-in':'auth:state'));
 document.getElementById('cancel').onclick=()=>{login.style.display='none'};login.addEventListener('click',e=>{if(e.target===login)login.style.display='none'});render();
})();
</script>
</body>
</html>
