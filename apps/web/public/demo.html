<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA — Interactive Product Demo</title><meta name="description" content="NEXA Universal Matching Platform interactive demo"><style>
:root{--bg:#0b0b0a;--panel:#121210;--panel2:#181815;--text:#f5f1e8;--muted:#858078;--gold:#b9a486;--line:rgba(255,255,255,.1);--green:#8ebf9a;--danger:#c98181}*{box-sizing:border-box}body{margin:0;background:#ebe6dc;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{width:min(1380px,calc(100% - 28px));margin:28px auto;background:var(--bg);border:1px solid #292722;border-radius:14px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.3)}.top{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{display:flex;align-items:center;gap:10px;letter-spacing:.12em}.mark{width:30px;height:30px;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold)}.demoBadge{font-size:9px;letter-spacing:.18em;color:var(--gold)}.body{display:grid;grid-template-columns:220px 1fr;min-height:760px}.side{border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column}.side small{color:#555;font-size:8px;letter-spacing:.2em;padding:0 12px 14px}.side button{border:0;background:transparent;color:#777;text-align:left;padding:13px 12px;display:flex;gap:12px;align-items:center;font-size:11px;border-radius:7px}.side button:hover,.side button.active{background:rgba(185,164,134,.09);color:#eee}.side i{font-style:normal;color:var(--gold);width:18px}.side b{margin-left:auto;background:var(--gold);color:#111;border-radius:10px;font-size:8px;padding:2px 6px}.sideFoot{margin-top:auto;border-top:1px solid var(--line);padding:16px 12px;display:grid;gap:5px;color:#555;font-size:8px}.sideFoot strong{color:var(--green);font-weight:400}.content{padding:38px 42px;background:radial-gradient(circle at 80% 0,rgba(185,164,134,.08),transparent 35%)}.head{display:flex;align-items:end;justify-content:space-between;margin-bottom:22px}.eyebrow{color:var(--gold);font-size:8px;letter-spacing:.2em}.head h1{font-size:30px;font-weight:400;letter-spacing:-.04em;margin:7px 0 0}.tools{display:flex;gap:8px;align-items:center}.input,.select{background:#161512;border:1px solid var(--line);color:#ddd;padding:11px 12px;border-radius:6px;outline:none}.input:focus{border-color:rgba(185,164,134,.55)}.btn{border:1px solid rgba(185,164,134,.35);background:transparent;color:#cdbb9f;padding:10px 13px;border-radius:6px;font-size:9px}.btn:hover{background:rgba(185,164,134,.08)}.btn.primary{background:var(--gold);color:#111;border-color:var(--gold)}.btn.danger{border-color:rgba(201,129,129,.5);color:#d99a9a}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 16px}.filters button{border:1px solid var(--line);background:transparent;color:#888;padding:8px 12px;border-radius:999px;font-size:9px}.filters button.active{background:var(--gold);color:#111;border-color:var(--gold)}.searchRow{display:flex;gap:8px;margin-bottom:14px}.searchRow .input{flex:1}.count{font-size:9px;color:#666;align-self:center}.candidate{display:grid;grid-template-columns:160px 1fr auto;gap:28px;align-items:center;padding:28px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(135deg,#1d1d19,#10100f);position:relative}.avatar{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#9b886e,#403a31 48%,#181714 76%);font:italic 70px Georgia;color:#ddd0bf;position:relative}.online{position:absolute;right:9px;bottom:11px;width:14px;height:14px;border-radius:50%;border:3px solid #191815;background:#555}.online.on{background:var(--green)}.personName{font-size:48px;font-weight:400;margin:7px 0 2px;letter-spacing:-.05em}.sub{font-size:11px;color:#777}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}.tags span{border:1px solid var(--line);padding:7px 10px;color:#999;font-size:8px}.score{text-align:right}.score strong{display:block;color:#d2bd9c;font-size:44px;font-weight:400}.score span{font-size:8px;color:#666}.matchLabel{position:absolute;right:18px;top:16px;color:var(--gold);font-size:8px;letter-spacing:.2em}.actions{display:flex;gap:8px;justify-content:center;margin:16px 0}.actions button{min-width:110px}.strip{display:flex;gap:8px;overflow:auto;padding:8px 0 18px}.mini{border:1px solid var(--line);background:rgba(255,255,255,.02);color:#aaa;padding:8px;display:flex;gap:8px;align-items:center;min-width:110px;border-radius:6px}.mini.active{border-color:var(--gold)}.mini .mavatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#39342d;color:#eee}.mini span{font-size:8px;text-align:left}.mini small{display:block;color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding-top:16px;color:#666;font-size:8px}.stats strong{display:block;color:#ddd;font-size:14px;font-weight:400;margin-top:4px}.list{display:grid;gap:8px}.row{display:flex;align-items:center;gap:14px;padding:15px;border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:7px}.row:hover{border-color:rgba(185,164,134,.3)}.rowMain{flex:1;display:grid;gap:5px}.rowMain b{font-size:12px;font-weight:400}.rowMain span,.row em{font-size:8px;color:#777;font-style:normal}.mavatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#8b7962,#292721);font:italic 21px Georgia}.chat{min-height:520px;border:1px solid var(--line);display:flex;flex-direction:column;border-radius:8px}.chatHead{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line)}.chatHead div:nth-child(2){flex:1}.chatHead b{font-size:12px;font-weight:400;display:block}.chatHead span{font-size:8px;color:var(--green)}.bubbles{flex:1;padding:22px;display:grid;align-content:start;gap:10px}.bubble{max-width:70%;padding:11px 13px;font-size:9px;line-height:1.7}.them{background:#24231f;color:#bbb}.mine{justify-self:end;background:var(--gold);color:#111}.mine small{display:block;font-size:7px;opacity:.55}.compose{display:flex;border-top:1px solid var(--line)}.compose input{flex:1;background:transparent;border:0;color:#eee;padding:16px;outline:none}.compose button{border:0;background:var(--gold);color:#111;padding:0 20px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{border:1px solid var(--line);background:rgba(255,255,255,.025);padding:18px;border-radius:7px;color:#aaa;text-align:left}.card:hover{border-color:rgba(185,164,134,.35);transform:translateY(-1px)}.card b{color:#ddd;font-weight:400}.card span{display:block;color:#777;font-size:8px;margin-top:7px}.profileCard{display:flex;align-items:center;gap:20px;border:1px solid var(--line);padding:22px;border-radius:9px;background:linear-gradient(135deg,rgba(185,164,134,.08),rgba(255,255,255,.02))}.bigAvatar{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#8b7962,#292721);font:italic 43px Georgia}.profileCard h2{font-size:28px;font-weight:400;margin:0 0 4px}.profileCard p{font-size:10px;color:#777}.globalGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:7px;color:#777;font-size:9px}.field select,.field input,.field textarea{background:#171613;color:#ddd;border:1px solid var(--line);padding:12px;border-radius:6px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.tile{padding:16px;border:1px solid var(--line);color:#666;font-size:8px}.tile b{display:block;color:#ddd;font-size:12px;font-weight:400;margin-top:7px}.notice{padding:18px;border:1px solid rgba(185,164,134,.2);background:rgba(185,164,134,.06);color:#aaa;font-size:10px;line-height:1.7;border-radius:7px}.toggle{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:rgba(255,255,255,.025);color:#aaa;padding:17px;border-radius:7px;width:100%;text-align:left}.toggle b{color:var(--gold);font-weight:400}.modal{position:fixed;inset:0;z-index:20;background:rgba(5,5,4,.75);backdrop-filter:blur(12px);display:grid;place-items:center;padding:18px}.modalCard{width:min(580px,100%);max-height:88vh;overflow:auto;background:linear-gradient(145deg,#1a1916,#0d0d0c);border:1px solid rgba(185,164,134,.25);border-radius:14px;padding:26px;box-shadow:0 40px 100px #000}.modalHead{display:flex;justify-content:space-between}.modalHead span{font-size:8px;letter-spacing:.2em;color:var(--gold)}.modalHead h2{font-size:24px;font-weight:400;margin:7px 0}.close{border:1px solid var(--line);background:none;color:#eee;width:34px;height:34px;border-radius:50%}.modalBody{margin-top:18px;color:#aaa;font-size:11px;line-height:1.8}.modalActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.choice{display:flex;justify-content:space-between;width:100%;border:1px solid var(--line);background:rgba(255,255,255,.02);color:#bbb;padding:12px;border-radius:6px}.choice.selected{border-color:var(--gold);color:#eee}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.gallery div{aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(145deg,#4d453a,#211f1b);color:#ddd;border:1px solid var(--line)}.hidden{display:none!important}@media(max-width:850px){.body{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px}.side small,.sideFoot{display:none}.side button{justify-content:center;display:grid;gap:4px;text-align:center;padding:9px 4px}.side button b{display:none}.content{padding:25px 18px}.candidate{grid-template-columns:100px 1fr}.avatar{width:100px;height:100px;font-size:48px}.score{grid-column:2;text-align:left}.personName{font-size:34px}.grid2,.globalGrid{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}}@media(max-width:560px){.top{padding:0 13px}.demoBadge{display:none}.candidate{grid-template-columns:1fr;text-align:center}.avatar{margin:auto}.tags{justify-content:center}.score{text-align:center;grid-column:auto}.actions{flex-wrap:wrap}.stats{grid-template-columns:repeat(2,1fr);gap:12px}.tiles{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><span class="mark">N</span><span>NEXA</span></div><span class="demoBadge">INTERACTIVE PRODUCT DEMO</span><span id="session">Satoshi · Demo</span></header><div class="body"><aside class="side"><small>PRODUCT</small><button data-view="discover" class="active"><i>⌕</i><span>探す</span></button><button data-view="matches"><i>♡</i><span>マッチ</span><b id="matchBadge">0</b></button><button data-view="messages"><i>▱</i><span>メッセージ</span></button><button data-view="notifications"><i>◌</i><span>通知</span><b id="noticeBadge">3</b></button><button data-view="profile"><i>◎</i><span>プロフィール</span></button><button data-view="safety"><i>◇</i><span>安心・安全</span></button><button data-view="global"><i>◍</i><span>地域・言語</span></button><button data-view="settings"><i>⚙</i><span>設定</span></button><div class="sideFoot"><span>DEMO MODE</span><strong id="safeStatus">● 安全モード ON</strong></div></aside><main class="content" id="app"></main></div></div><div id="modalRoot"></div><script>
const profiles=[{name:'Mika',role:'クリエイター',place:'東京',tags:['写真','旅行','デザイン'],score:96,initial:'M',online:true,purpose:'恋愛・友だち'},{name:'Alex',role:'プロダクトマネージャー',place:'大阪',tags:['起業','音楽','カフェ'],score:91,initial:'A',online:true,purpose:'仕事・友だち'},{name:'Lina',role:'フリーランサー',place:'京都',tags:['アート','旅','コミュニティ'],score:98,initial:'L',online:false,purpose:'趣味・友だち'},{name:'Noah',role:'コミュニティ運営',place:'横浜',tags:['読書','イベント','地域'],score:94,initial:'N',online:true,purpose:'コミュニティ・仕事'}];
const state={view:'discover',cat:'すべて',search:'',sort:'相性順',current:0,liked:[],passed:[],matched:[],blocked:[],messages:{},notifications:3,safe:true,language:'日本語',region:'日本',publicRange:'公開',verified:true,gallery:6,email:true,push:true,compact:false,loggedOut:false};
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function filtered(){let a=profiles.map((p,i)=>({...p,i})).filter(x=>!state.blocked.includes(x.i)&&!state.passed.includes(x.i));if(state.search)a=a.filter(x=>`${x.name} ${x.role} ${x.place} ${x.tags.join(' ')}`.toLowerCase().includes(state.search.toLowerCase()));if(state.cat!=='すべて')a=a.filter(x=>x.purpose.includes(state.cat));if(state.sort==='相性順')a.sort((a,b)=>b.score-a.score);if(state.sort==='名前順')a.sort((a,b)=>a.name.localeCompare(b.name));if(state.sort==='新着順')a.sort((a,b)=>Number(b.online)-Number(a.online));return a}
function openModal(title,body,actions=''){document.querySelector('#modalRoot').innerHTML=`<div class="modal" id="modal"><div class="modalCard"><div class="modalHead"><div><span>NEXA DEMO FLOW</span><h2>${title}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="modalBody">${body}</div><div class="modalActions">${actions}<button class="btn" onclick="closeModal()">閉じる</button></div></div></div>`}function closeModal(){$('#modalRoot').innerHTML=''}
function detail(i=state.current){const p=profiles[i];openModal(`${p.name} のプロフィール`,`<p style="font-size:15px;color:#ddd">${p.score}% の相性 · ${esc(p.role)} · ${esc(p.place)}</p><div class="tags">${p.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div><p>目的：${esc(p.purpose)}。オンライン状態、興味、地域を確認して次の操作へ進めます。</p>`, `<button class="btn primary" onclick="like(${i});closeModal()">♡ いいね</button><button class="btn" onclick="match(${i});closeModal()">マッチを成立</button>`)}
function like(i=state.current){if(!state.liked.includes(i))state.liked.push(i);if(!state.matched.includes(i))state.matched.push(i);state.notifications=Math.max(state.notifications,1);render()}
function match(i=state.current){like(i);state.view='matches';render()}
function pass(i=state.current){if(!state.passed.includes(i))state.passed.push(i);state.current=(i+1)%profiles.length;render()}
function block(i=state.current){if(!state.blocked.includes(i))state.blocked.push(i);state.current=(i+1)%profiles.length;closeModal();render()}
function report(){state.reported=true;closeModal();render()}
function send(){const el=$('#messageInput');if(!el||!el.value.trim())return;const i=state.current;state.messages[i]=[...(state.messages[i]||[]),el.value.trim()];el.value='';render()}
function renderDiscover(){const a=filtered();const p=profiles[state.current];return `<div class="head"><div><span class="eyebrow">DISCOVER</span><h1>あなたに合う相手</h1></div><div class="tools"><select class="select" onchange="state.sort=this.value;render()"><option ${state.sort==='相性順'?'selected':''}>相性順</option><option ${state.sort==='新着順'?'selected':''}>新着順</option><option ${state.sort==='名前順'?'selected':''}>名前順</option></select></div></div><div class="searchRow"><input class="input" value="${esc(state.search)}" oninput="state.search=this.value;render()" placeholder="名前・職種・地域・興味で検索"><span class="count">${a.length} 件</span></div><div class="filters">${['すべて','恋愛','友だち','仕事','趣味'].map(x=>`<button class="${state.cat===x?'active':''}" onclick="state.cat='${x}';render()">${x}</button>`).join('')}</div><div class="candidate ${state.matched.includes(state.current)?'matched':''}"><button class="avatar" style="border:0" onclick="detail()">${p.initial}<i class="online ${p.online?'on':''}"></i></button><div><span class="eyebrow">${p.online?'● オンライン':'○ 最近アクティブ'}</span><button style="display:block;border:0;background:none;color:inherit;padding:0;text-align:left" onclick="detail()"><div class="personName">${p.name}</div></button><div class="sub">${p.role} · ${p.place}</div><div class="tags">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div></div><div class="score"><strong>${p.score}%</strong><span>相性</span></div>${state.matched.includes(state.current)?'<div class="matchLabel">MATCH</div>':''}</div><div class="actions"><button class="btn" onclick="pass()">スキップ</button><button class="btn primary" onclick="like()">${state.matched.includes(state.current)?'✓ MATCH成立':'♡ いいね'}</button><button class="btn" onclick="state.current=(state.current+1)%profiles.length;render()">次へ →</button><button class="btn" onclick="detail()">詳細を見る</button></div><div class="stats"><span>候補<strong>${profiles.length}</strong></span><span>いいね<strong>${state.liked.length}</strong></span><span>マッチ<strong>${state.matched.length}</strong></span><span>安全<strong>${state.safe?'ON':'OFF'}</strong></span></div><div class="strip">${a.map(x=>`<button class="mini ${x.i===state.current?'active':''}" onclick="state.current=${x.i};render()"><i class="mavatar">${x.initial}</i><span>${x.name}<small>${x.score}%</small></span></button>`).join('')}</div>`}
function renderMatches(){const a=profiles.filter((_,i)=>state.matched.includes(i));return `<div class="head"><div><span class="eyebrow">CONNECTIONS</span><h1>マッチ一覧</h1></div><span class="count">${a.length} 件</span></div><div class="list">${a.map(p=>{const i=profiles.indexOf(p);return `<div class="row"><i class="mavatar">${p.initial}</i><div class="rowMain"><b>${p.name}</b><span>${p.role} · ${p.place}</span></div><button class="btn" onclick="state.current=${i};state.view='messages';render()">メッセージ</button><button class="btn" onclick="state.matched=state.matched.filter(x=>x!==${i});render()">解除</button></div>`}).join('')||'<div class="notice">探す画面で「いいね」を押すと、ここにマッチが表示されます。</div>'}</div>`}
function renderMessages(){const p=profiles[state.current],msgs=state.messages[state.current]||[];return `<div class="head"><div><span class="eyebrow">MESSAGES</span><h1>メッセージ</h1></div><button class="btn" onclick="openModal('会話オプション','<div class=\'choiceList\'></div>', '<button class=\'btn danger\' onclick=\'openReport()\'>会話を通報</button>')">⋯</button></div><div class="chat"><div class="chatHead"><i class="mavatar">${p.initial}</i><div><b>${p.name}</b><span>${p.online?'オンライン':'最近アクティブ'} · 安全な会話</span></div><button class="btn" onclick="detail()">プロフィール</button></div><div class="bubbles"><div class="bubble them">こんにちは。プロフィールを見てくれてありがとう。</div>${msgs.map(x=>`<div class="bubble mine">${esc(x)}<small>既読</small></div>`).join('')}</div><div class="compose"><button onclick="openMedia()">＋</button><input id="messageInput" placeholder="メッセージを入力…" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">送信</button></div></div>`}
function renderNotifications(){return `<div class="head"><div><span class="eyebrow">ACTIVITY</span><h1>通知</h1></div><button class="btn" onclick="state.notifications=0;render()">すべて既読</button></div><div class="list"><div class="row"><i class="mavatar">♡</i><div class="rowMain"><b>新しいマッチ</b><span>Mikaさんとマッチしました。</span></div><em>たった今</em></div><div class="row"><i class="mavatar">✦</i><div class="rowMain"><b>おすすめ</b><span>あなたと96%相性のプロフィールがあります。</span></div><em>8分前</em></div><div class="row"><i class="mavatar">✓</i><div class="rowMain"><b>安全確認</b><span>安全設定が有効です。</span></div><em>今日</em></div>${state.notifications===0?'<div class="notice">すべての通知を確認済みです。</div>':''}</div>`}
function renderProfile(){return `<div class="head"><div><span class="eyebrow">MY PROFILE</span><h1>プロフィール</h1></div><span class="count">92% 完成</span></div><div class="profileCard"><div class="bigAvatar">S</div><div><h2>Satoshi</h2><p>クリエイター · 日本</p><div class="tags"><span>デザイン</span><span>プロダクト</span><span>旅行</span></div></div></div><div class="grid2" style="margin-top:10px"><button class="card" onclick="openEdit()"><b>プロフィールを編集</b><span>表示名・役割・自己紹介・興味</span></button><button class="card" onclick="openVisibility()"><b>公開範囲</b><span>${state.publicRange}</span></button><button class="card" onclick="openVerification()"><b>本人確認</b><span>${state.verified?'認証済み ✓':'未確認'}</span></button><button class="card" onclick="openGallery()"><b>写真・ギャラリー</b><span>${state.gallery}枚</span></button></div>`}
function renderSafety(){return `<div class="head"><div><span class="eyebrow">TRUST & SAFETY</span><h1>安心・安全</h1></div><span class="count">${state.safe?'保護中':'標準'}</span></div><div class="grid2"><button class="card" onclick="openBlock()"><b>ブロック</b><span>相手を候補から非表示</span></button><button class="card" onclick="openReport()"><b>通報</b><span>${state.reported?'送信済み':'理由を選択して送信'}</span></button><button class="card" onclick="state.safe=!state.safe;render()"><b>安全モード</b><span>${state.safe?'ON':'OFF'}</span></button><button class="card" onclick="openPrivacy()"><b>プライバシー</b><span>位置情報・公開範囲を保護</span></button></div><p class="notice" style="margin-top:12px">デモでは操作結果を画面に反映します。実運用では運営ルール、証拠情報、モデレーション、レート制限等を接続できます。</p>`}
function renderGlobal(){return `<div class="head"><div><span class="eyebrow">GLOBAL</span><h1>地域・言語</h1></div><span class="count">地域対応</span></div><div class="globalGrid"><label class="field">表示言語<select onchange="state.language=this.value;render()"><option ${state.language==='日本語'?'selected':''}>日本語</option><option ${state.language==='English'?'selected':''}>English</option><option ${state.language==='한국어'?'selected':''}>한국어</option><option ${state.language==='中文'?'selected':''}>中文</option></select></label><label class="field">利用地域<select onchange="state.region=this.value;render()"><option>日本</option><option>米国</option><option>EU</option><option>東南アジア</option></select></label></div><div class="tiles"><div class="tile">国 / 地域<b>${state.region}</b></div><div class="tile">言語<b>${state.language}</b></div><div class="tile">タイムゾーン<b>${state.region==='日本'?'JST':state.region==='米国'?'PST / EST':'UTC'}</b></div><div class="tile">距離検索<b>有効</b></div><div class="tile">位置情報<b>保護</b></div><div class="tile">ロケール<b>${state.language==='日本語'?'ja-JP':state.language==='English'?'en-US':'global'}</b></div></div>`}
function renderSettings(){return `<div class="head"><div><span class="eyebrow">SETTINGS</span><h1>設定</h1></div><span class="count">${state.loggedOut?'デモ終了':'保存済み'}</span></div><div class="list"><button class="toggle" onclick="state.safe=!state.safe;render()"><span>安全モード</span><b>${state.safe?'ON':'OFF'}</b></button><button class="toggle" onclick="openNotificationSettings()"><span>通知設定</span><b>${state.email||state.push?'カスタム':'OFF'}</b></button><button class="toggle" onclick="openAccessibility()"><span>表示・アクセシビリティ</span><b>${state.compact?'コンパクト':'標準'}</b></button><button class="toggle" onclick="openAccount()"><span>アカウント</span><b>${state.loggedOut?'ログアウト済み':'管理'}</b></button></div>`}
function openEdit(){openModal('プロフィールを編集',`<label class="field">表示名<input value="Satoshi"></label><label class="field">役割<input value="クリエイター"></label><label class="field">自己紹介<textarea>デザインとプロダクトが好きです。</textarea></label><label class="field">興味<input value="デザイン, プロダクト, 旅行"></label>`,`<button class="btn primary" onclick="closeModal()">保存する</button>`)}
function openVisibility(){openModal('公開範囲',`<div class="list">${['公開','マッチした相手のみ','非公開'].map(x=>`<button class="choice ${state.publicRange===x?'selected':''}" onclick="state.publicRange='${x}';openVisibility()">${x}<span>${state.publicRange===x?'✓':''}</span></button>`).join('')}</div>`)}
function openVerification(){openModal('本人確認',`<p>確認ステータス：<strong style="color:#b9a486">${state.verified?'認証済み ✓':'未確認'}</strong></p><p>デモでは確認済み状態を切り替えられます。実運用では本人確認プロバイダーへ接続できます。</p>`,`<button class="btn primary" onclick="state.verified=true;closeModal();render()">確認済みにする</button>`)}
function openGallery(){openModal('写真・ギャラリー',`<p>公開中：${state.gallery}枚</p><div class="gallery">${Array.from({length:state.gallery},(_,i)=>`<div>${i+1}</div>`).join('')}</div>`,`<button class="btn primary" onclick="state.gallery++;openGallery()">写真を追加</button>`)}
function openBlock(){const p=profiles[state.current];openModal('ブロック',`<p>${p.name}をブロックすると、この相手は候補一覧から非表示になります。</p>`,`<button class="btn danger" onclick="block()">${p.name}をブロック</button>`)}
function openReport(){openModal('通報フロー',`<div class="list">${['迷惑行為','不適切なプロフィール','詐欺・なりすまし','その他'].map(x=>`<button class="choice" onclick="this.classList.toggle('selected')">${x}<span>›</span></button>`).join('')}</div><p>選択した理由を運営へ送信する想定です。</p>`,`<button class="btn danger" onclick="report()">送信する</button>`)}
function openPrivacy(){openModal('プライバシー',`<div class="list"><div class="choice">位置情報の公開 <span>非公開</span></div><div class="choice">正確な位置 <span>保護</span></div><div class="choice">プロフィール公開 <span>${state.publicRange}</span></div></div>`)}
function openNotificationSettings(){openModal('通知設定',`<div class="list"><button class="toggle" onclick="state.email=!state.email;openNotificationSettings()">メール通知 <b>${state.email?'ON':'OFF'}</b></button><button class="toggle" onclick="state.push=!state.push;openNotificationSettings()">プッシュ通知 <b>${state.push?'ON':'OFF'}</b></button></div>`)}
function openAccessibility(){openModal('表示・アクセシビリティ',`<div class="list"><button class="toggle" onclick="state.compact=!state.compact;openAccessibility()">コンパクト表示 <b>${state.compact?'ON':'OFF'}</b></button><div class="notice">文字サイズ、コントラスト、モーション制御などへ拡張可能です。</div></div>`)}
function openAccount(){openModal('アカウント',`<p>デモアカウント：Satoshi / Demo</p><p>データ削除、メール変更、セッション管理などの管理画面へ拡張できます。</p>`,`<button class="btn danger" onclick="state.loggedOut=true;closeModal();$('#session').textContent='Demo session ended';render()">ログアウト</button>`)}
function openMedia(){openModal('メディア送信','<p>画像・ファイル・位置情報などの添付UIを体験するためのデモです。</p>','<button class="btn primary" onclick="closeModal()">画像を選択した想定</button>')}
function render(){const app=$('#app');app.innerHTML=state.view==='discover'?renderDiscover():state.view==='matches'?renderMatches():state.view==='messages'?renderMessages():state.view==='notifications'?renderNotifications():state.view==='profile'?renderProfile():state.view==='safety'?renderSafety():state.view==='global'?renderGlobal():renderSettings();document.querySelectorAll('.side button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));$('#matchBadge').textContent=state.matched.length;$('#noticeBadge').textContent=state.notifications||'';$('#noticeBadge').classList.toggle('hidden',!state.notifications);$('#safeStatus').textContent=`● 安全モード ${state.safe?'ON':'OFF'}`)}
document.querySelectorAll('.side button').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;render()}));render();
</script></body></html>
