<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXA — Universal Matching Platform Demo</title>
<style>
:root{--bg:#090a0d;--panel:#111319;--panel2:#171a21;--line:#2a2e38;--text:#f5f5f2;--muted:#9da3ad;--accent:#d9bd7d;--accent2:#8fb9ff;--ok:#76d7ad;--danger:#ff8585}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#263047 0,#0d0f14 38%,#090a0d 70%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid #20232b;background:#090a0de8;backdrop-filter:blur(16px)}.brand{font-weight:800;letter-spacing:.18em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.22em;margin-top:4px}.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 14px}.btn:hover{border-color:#555b68}.btn.primary{background:var(--accent);color:#15130f;border-color:var(--accent);font-weight:750}.btn.ghost{background:transparent}.btn.danger{border-color:#63383b;color:#ffb1b1}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 74px)}aside{border-right:1px solid var(--line);padding:20px 14px;background:#0b0c10}.nav-title{font-size:10px;color:#6f7580;letter-spacing:.18em;padding:8px 10px}.nav button{width:100%;display:flex;justify-content:space-between;gap:8px;border:0;background:transparent;color:#aeb4bd;padding:11px 12px;border-radius:10px;text-align:left}.nav button.active,.nav button:hover{background:#191c23;color:#fff}.badge{min-width:20px;text-align:center;border-radius:10px;background:#8c5b62;color:#fff;font-size:11px;padding:2px 6px}.side-note{margin:24px 8px;padding:14px;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:12px;line-height:1.6}.main{padding:34px;max-width:1250px;width:100%;margin:auto}.hero{padding:34px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,#171a21,#101218);box-shadow:0 24px 70px #0005}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.2em;text-transform:uppercase}.hero h1{font-size:clamp(34px,5vw,68px);line-height:1.02;margin:12px 0}.hero p{max-width:720px;color:var(--muted);font-size:16px;line-height:1.75}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}.card{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:18px}.card h3{margin:0 0 7px}.muted{color:var(--muted)}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:18px}.section-head h2{margin:0;font-size:30px}.controls{display:flex;gap:8px;flex-wrap:wrap}.input,.select,.textarea{width:100%;border:1px solid var(--line);background:#0c0e12;color:#fff;border-radius:10px;padding:11px}.controls .input,.controls .select{width:auto;min-width:150px}.profile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.profile{overflow:hidden;padding:0}.avatar{height:150px;display:grid;place-items:center;font-size:54px;background:linear-gradient(135deg,#232735,#15171d);border-bottom:1px solid var(--line)}.profile-body{padding:17px}.score{color:var(--accent);font-weight:750}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tag{border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:#c8ccd3;font-size:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.actions{display:flex;gap:7px;margin-top:14px}.actions .btn{flex:1}.detail{display:grid;grid-template-columns:260px 1fr;gap:18px}.detail-avatar{height:280px;border-radius:18px;border:1px solid var(--line);display:grid;place-items:center;font-size:90px;background:linear-gradient(145deg,#252936,#101217)}.list{display:grid;gap:10px}.list-item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:13px}.mini{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#242832;font-size:20px}.grow{flex:1}.status{font-size:11px;color:var(--ok)}.chat{display:grid;grid-template-columns:290px 1fr;min-height:560px;border:1px solid var(--line);border-radius:18px;overflow:hidden}.chat-list{background:#0d0f13;border-right:1px solid var(--line);padding:12px}.chat-list button{width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:10px;border-radius:10px}.chat-list button.active,.chat-list button:hover{background:#1a1d24}.thread{display:flex;flex-direction:column;background:#0b0d11}.thread-head{padding:16px;border-bottom:1px solid var(--line)}.msgs{flex:1;padding:18px;display:flex;flex-direction:column;gap:9px;overflow:auto}.msg{max-width:70%;padding:10px 13px;border-radius:14px;background:#1a1d24}.msg.mine{align-self:flex-end;background:#d9bd7d;color:#17140f}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.composer input{flex:1}.notice{padding:12px 14px;border-radius:12px;background:#171a21;border:1px solid var(--line);margin-bottom:10px}.notice.ok{border-color:#2f5c4c}.notice.warn{border-color:#5d4545}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.step{border:1px solid var(--line);border-radius:12px;padding:11px;background:#0e1015}.step.done{border-color:#3c6254}.step b{display:block;font-size:12px}.step small{color:var(--muted)}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:30}.modal-box{width:min(620px,100%);background:#111319;border:1px solid var(--line);border-radius:20px;padding:22px}.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:#f3f1ea;color:#151515;padding:12px 16px;border-radius:12px;z-index:40;box-shadow:0 15px 45px #0008}.footer{margin-top:22px;color:#6f7580;font-size:11px;text-align:center}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.main{padding:18px}.grid,.profile-grid{grid-template-columns:1fr 1fr}.detail,.chat{grid-template-columns:1fr}.chat-list{border-right:0;border-bottom:1px solid var(--line)}.steps{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.profile-grid{grid-template-columns:1fr}.top{padding:13px 15px}.main{padding:12px}.hero{padding:22px}.top-actions .btn.ghost{display:none}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const profiles=[
{id:'mika',name:'Mika',role:'クリエイター',area:'東京',country:'日本',score:96,category:'クリエイター',bio:'ブランドと映像を組み合わせたプロジェクトを探しています。',tags:['デザイン','映像','共同制作'],initial:'M'},
{id:'alex',name:'Alex',role:'プロダクトマネージャー',area:'大阪',country:'日本',score:91,category:'ビジネス',bio:'新規プロダクトを一緒に育てられる仲間を探しています。',tags:['PM','SaaS','事業開発'],initial:'A'},
{id:'lina',name:'Lina',role:'フリーランサー',area:'京都',country:'日本',score:98,category:'クリエイター',bio:'海外案件にも対応。専門性の違う人との協業が好きです。',tags:['海外','UI/UX','制作'],initial:'L'},
{id:'noah',name:'Noah',role:'コミュニティ運営',area:'横浜',country:'日本',score:94,category:'コミュニティ',bio:'安全で長く続くコミュニティを作っています。',tags:['コミュニティ','運営','安全'],initial:'N'}
];
const launchItems=[['brand','ブランド名・ロゴ'],['color','ブランドカラー'],['region','地域設定'],['language','言語'],['category','マッチングカテゴリ'],['profile','プロフィール項目'],['rules','利用ルール'],['safety','安全設定'],['notify','通知設定'],['legal','法務表示']];
const S={view:'home',started:false,query:'',category:'すべて',region:'日本',language:'日本語',liked:new Set(),incoming:new Set(['mika']),matches:new Set(),active:null,blocked:new Set(),reported:new Set(),notifications:3,safe:true,messages:{},profile:{name:'Satoshi',role:'クリエイター',bio:'プロダクトとデザインが好きです。'},launch:Object.fromEntries(launchItems.map(([k])=>[k,false])),brand:'NEXA'};
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(window._t);window._t=setTimeout(()=>e.classList.add('hidden'),2200)}
function candidateList(){return profiles.filter(p=>!S.blocked.has(p.id)&&p.name.toLowerCase().includes(S.query.toLowerCase())&&(S.category==='すべて'||p.category===S.category)&&(S.region==='すべて'||p.country===S.region))}
function matched(){return profiles.filter(p=>S.matches.has(p.id))}
function go(view,id=null){S.view=view;if(id)S.active=id;render()}
function start(){S.started=true;S.view='discover';render()}
function like(id){if(S.blocked.has(id))return;S.liked.add(id);toast('いいねを送りました');render()}
function mutual(id){if(!S.liked.has(id)){toast('先に「いいね」を送ってください');return}if(!S.incoming.has(id)){toast('相手からのいいね待ちです');return}S.matches.add(id);S.active=id;S.notifications++;toast('MATCH成立。メッセージが解放されました');render()}
function block(id){S.blocked.add(id);S.liked.delete(id);S.matches.delete(id);if(S.active===id)S.active=null;S.notifications++;toast('ブロックしました。候補から除外しました');render()}
function report(id){S.reported.add(id);S.notifications++;toast('通報を管理キューへ送信しました');render()}
function send(){const input=document.getElementById('msg');const p=matched().find(x=>x.id===S.active);if(!p){toast('MATCH成立後にメッセージを送れます');return}const text=input.value.trim();if(!text)return;(S.messages[p.id]??=[]).push({mine:true,text});input.value='';S.notifications++;render()}
function reset(){location.reload()}
function nav(){const items=[['discover','探す'],['matches','マッチ'],['messages','メッセージ'],['notifications','通知'],['profile','プロフィール'],['safety','安心・安全'],['global','地域・言語'],['settings','設定'],['admin','管理・分析'],['launch','Quick Launch']];return `<div class="nav-title">PRODUCT WALKTHROUGH</div><div class="nav">${items.map(([v,l])=>`<button class="${S.view===v?'active':''}" onclick="go('${v}')"><span>${l}</span>${v==='notifications'&&S.notifications?`<span class="badge">${S.notifications}</span>`:''}</button>`).join('')}</div><div class="side-note">デモモード<br>架空データのみ使用<br>安全設定：${S.safe?'ON':'OFF'}</div>`}
function shell(content){document.getElementById('app').innerHTML=`<div class="shell"><header class="top"><div class="brand">${esc(S.brand)}<small>UNIVERSAL MATCHING PLATFORM</small></div><div class="top-actions"><button class="btn ghost" onclick="go('home')">トップ</button><button class="btn" onclick="reset()">デモをリセット</button></div></header><div class="layout"><aside>${nav()}</aside><main class="main">${content}<div class="footer">Demo mode · fictional data · safety-first matching walkthrough</div></main></div></div>`}
function home(){return `<div class="hero"><div class="eyebrow">Commercial demo / Web · iOS · Android concept</div><h1>世界中の「出会う」を、<br>ひとつの基盤に。</h1><p>ユーザー登録からプロフィール、条件検索、いいね、相互MATCH、会話、通知、安全機能までを一つの流れで体験できるユニバーサル・マッチング基盤の販売用プロダクトデモです。</p><div class="hero-actions"><button class="btn primary" onclick="start()">デモを開始する →</button><button class="btn" onclick="go('discover')">先に機能を見る</button></div></div><div class="grid"><div class="card"><h3>01 · Discover</h3><p class="muted">条件・カテゴリ・地域から候補を絞り込み、プロフィールを確認。</p></div><div class="card"><h3>02 · Match</h3><p class="muted">一方的なLIKEではなく、双方のLIKEでMATCHを成立。</p></div><div class="card"><h3>03 · Safety</h3><p class="muted">ブロック・通報・安全設定をマッチング体験に統合。</p></div></div><div class="card" style="margin-top:18px"><h3>体験できる販売価値</h3><div class="steps">${launchItems.slice(0,5).map((x,i)=>`<div class="step done"><b>${String(i+1).padStart(2,'0')} ${x[1]}</b><small>購入者が設定可能</small></div>`).join('')}</div></div>`}
function discover(){const list=candidateList();return `<div class="section-head"><div><div class="eyebrow">01 · Discover</div><h2>探す</h2><p class="muted">ユーザー → プロフィール → 条件 → いいね → MATCH</p></div></div><div class="card"><div class="controls"><input class="input" placeholder="名前で検索" value="${esc(S.query)}" oninput="S.query=this.value;render()"><select class="select" onchange="S.category=this.value;render()"><option>すべて</option><option ${S.category==='クリエイター'?'selected':''}>クリエイター</option><option ${S.category==='ビジネス'?'selected':''}>ビジネス</option><option ${S.category==='コミュニティ'?'selected':''}>コミュニティ</option></select><select class="select" onchange="S.region=this.value;render()"><option>日本</option><option ${S.region==='すべて'?'selected':''}>すべて</option></select><button class="btn" onclick="S.query='';S.category='すべて';S.region='日本';render()">条件をリセット</button></div></div><div class="profile-grid" style="margin-top:18px">${list.map(profileCard).join('')||`<div class="card"><h3>候補がありません</h3><p class="muted">検索条件を変更してください。</p></div>`}</div>`}
function profileCard(p){const liked=S.liked.has(p.id),isMatch=S.matches.has(p.id);return `<div class="card profile"><div class="avatar">${p.initial}</div><div class="profile-body"><div class="row"><h3>${esc(p.name)}</h3><span class="score">${p.score}%</span></div><div>${esc(p.role)} · ${esc(p.area)}</div><p class="muted">${esc(p.bio)}</p><div class="tags">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="actions"><button class="btn" onclick="go('profileDetail','${p.id}')">プロフィール</button>${isMatch?`<button class="btn primary" onclick="go('messages','${p.id}')">メッセージ</button>`:liked?`<button class="btn primary" onclick="mutual('${p.id}')">相互MATCH</button>`:`<button class="btn primary" onclick="like('${p.id}')">♡ いいね</button>`}</div></div></div>`}
function detail(){const p=profiles.find(x=>x.id===S.active)||profiles[0];return `<div class="section-head"><div><div class="eyebrow">Profile review</div><h2>${esc(p.name)} のプロフィール</h2></div><button class="btn" onclick="go('discover')">← 探すへ戻る</button></div><div class="detail"><div class="detail-avatar">${p.initial}</div><div class="card"><div class="row"><div><h2>${esc(p.name)}</h2><p class="muted">${esc(p.role)} · ${esc(p.area)}</p></div><span class="score">Match ${p.score}%</span></div><p>${esc(p.bio)}</p><div class="tags">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="actions">${S.matches.has(p.id)?`<button class="btn primary" onclick="go('messages','${p.id}')">MATCH済み → 会話する</button>`:S.liked.has(p.id)?`<button class="btn primary" onclick="mutual('${p.id}')">相手からのLIKEと成立させる</button>`:`<button class="btn primary" onclick="like('${p.id}')">♡ いいねを送る</button>`}<button class="btn danger" onclick="block('${p.id}')">ブロック</button><button class="btn danger" onclick="report('${p.id}')">通報</button></div></div></div>`}
function matchesView(){const list=matched();return `<div class="section-head"><div><div class="eyebrow">02 · Mutual Match</div><h2>マッチ</h2><p class="muted">双方のLIKEが成立したユーザーだけがここに表示されます。</p></div></div>${list.length?`<div class="list">${list.map(p=>`<div class="list-item"><div class="mini">${p.initial}</div><div class="grow"><b>${esc(p.name)}</b><div class="muted">${esc(p.role)} · ${esc(p.area)}</div></div><span class="status">MATCH</span><button class="btn" onclick="go('messages','${p.id}')">会話を開く</button></div>`).join('')}</div>`:`<div class="card"><h3>まだMATCHはありません</h3><p class="muted">探す画面でLIKEを送り、相手からのLIKEがある候補は「相互MATCH」で成立できます。最初からMikaには相手側LIKEがあります。</p><button class="btn primary" onclick="go('discover')">候補を見る</button></div>`}`}
function messages(){const list=matched();const p=list.find(x=>x.id===S.active)||list[0];if(!p)return `<div class="card"><h2>メッセージ</h2><p class="muted">メッセージはMATCH成立後に解放されます。</p><button class="btn primary" onclick="go('discover')">MATCH候補を探す</button></div>`;S.active=p.id;const ms=S.messages[p.id]||[];return `<div class="section-head"><div><div class="eyebrow">03 · Conversation</div><h2>メッセージ</h2></div></div><div class="chat"><div class="chat-list">${list.map(x=>`<button class="${x.id===p.id?'active':''}" onclick="go('messages','${x.id}')"><div class="row"><span>${x.initial} ${esc(x.name)}</span><span class="status">MATCH</span></div></button>`).join('')}</div><div class="thread"><div class="thread-head"><b>${esc(p.name)}</b><div class="muted">${esc(p.role)} · 安全なMATCH会話</div></div><div class="msgs">${ms.length?ms.map(m=>`<div class="msg ${m.mine?'mine':''}">${esc(m.text)}</div>`).join(''):`<div class="notice">MATCH成立済み。最初のメッセージを送ってみましょう。</div>`}</div><div class="composer"><input id="msg" class="input" placeholder="メッセージを入力" onkeydown="if(event.key==='Enter')send()"><button class="btn primary" onclick="send()">送信</button></div></div></div>`}
function notifications(){return `<div class="section-head"><div><div class="eyebrow">04 · Notifications</div><h2>通知</h2></div><span class="badge">${S.notifications}</span></div><div class="list"><div class="notice ok"><b>MATCH通知</b><div class="muted">Mikaとの相互MATCHが可能です。</div></div><div class="notice"><b>安全センター</b><div class="muted">ブロック・通報は管理キューへ連携されます。</div></div><div class="notice"><b>設定変更</b><div class="muted">地域・言語・カテゴリ設定をいつでも変更できます。</div></div></div>`}
function profile(){return `<div class="section-head"><div><div class="eyebrow">05 · My Profile</div><h2>プロフィール</h2></div></div><div class="card"><div class="grid" style="margin-top:0"><div><label class="muted">表示名</label><input id="pn" class="input" value="${esc(S.profile.name)}"></div><div><label class="muted">役割</label><input id="pr" class="input" value="${esc(S.profile.role)}"></div><div><label class="muted">安全設定</label><div class="notice ok">${S.safe?'安全モード ON':'安全モード OFF'}</div></div></div><div style="margin-top:14px"><label class="muted">自己紹介</label><textarea id="pb" class="textarea" rows="4">${esc(S.profile.bio)}</textarea></div><button class="btn primary" style="margin-top:14px" onclick="S.profile={name:document.getElementById('pn').value,role:document.getElementById('pr').value,bio:document.getElementById('pb').value};toast('プロフィールを保存しました')">保存する</button></div>`}
function safety(){return `<div class="section-head"><div><div class="eyebrow">06 · Safety</div><h2>安心・安全</h2></div></div><div class="grid"><div class="card"><h3>安全モード</h3><p class="muted">安全性を優先したマッチング体験。</p><button class="btn ${S.safe?'primary':''}" onclick="S.safe=!S.safe;render()">${S.safe?'ON':'OFF'} に切り替え</button></div><div class="card"><h3>ブロック済み</h3><p class="muted">${S.blocked.size}人を候補から除外しています。</p><div>${[...S.blocked].map(id=>esc(profiles.find(p=>p.id===id)?.name||id)).join('、')||'なし'}</div></div><div class="card"><h3>通報済み</h3><p class="muted">${S.reported.size}件を管理キューへ送信。</p></div></div><div class="card" style="margin-top:16px"><h3>安全設計</h3><p class="muted">MATCH前のメッセージ禁止、ブロック時の候補・LIKE・MATCH除外、通報の管理連携をデモで確認できます。</p></div>`}
function global(){return `<div class="section-head"><div><div class="eyebrow">07 · Global</div><h2>地域・言語</h2></div></div><div class="grid"><div class="card"><h3>地域</h3><select class="select" onchange="S.region=this.value;render()"><option>日本</option><option ${S.region==='すべて'?'selected':''}>すべて</option></select></div><div class="card"><h3>言語</h3><select class="select" onchange="S.language=this.value;render()"><option ${S.language==='日本語'?'selected':''}>日本語</option><option ${S.language==='English'?'selected':''}>English</option></select></div><div class="card"><h3>現在の設定</h3><p><b>${esc(S.region)}</b> / <b>${esc(S.language)}</b></p><p class="muted">購入者が地域・言語を変更できる構成。</p></div></div>`}
function settings(){return `<div class="section-head"><div><div class="eyebrow">08 · Settings</div><h2>設定</h2></div></div><div class="list"><div class="list-item"><div class="grow"><b>通知</b><div class="muted">MATCH・メッセージ・安全通知</div></div><span class="status">ON</span></div><div class="list-item"><div class="grow"><b>安全モード</b><div class="muted">安全優先のデフォルト設定</div></div><button class="btn" onclick="S.safe=!S.safe;render()">${S.safe?'ON':'OFF'}</button></div><div class="list-item"><div class="grow"><b>デモデータ</b><div class="muted">いつでも初期状態へ戻せます</div></div><button class="btn danger" onclick="reset()">リセット</button></div></div>`}
function admin(){const total=profiles.length,likes=S.liked.size,m=S.matches.size;return `<div class="section-head"><div><div class="eyebrow">09 · Admin / Analytics</div><h2>管理・分析</h2></div></div><div class="grid"><div class="card"><div class="muted">候補ユーザー</div><h2>${total}</h2></div><div class="card"><div class="muted">送信LIKE</div><h2>${likes}</h2></div><div class="card"><div class="muted">成立MATCH</div><h2>${m}</h2></div></div><div class="card" style="margin-top:16px"><h3>デモイベント</h3><div class="list"><div class="list-item"><span class="status">LIVE</span><div class="grow">Discover / 条件検索</div></div><div class="list-item"><span class="status">LIVE</span><div class="grow">LIKE → Mutual Match</div></div><div class="list-item"><span class="status">LIVE</span><div class="grow">Match → Message</div></div><div class="list-item"><span class="status">LIVE</span><div class="grow">Safety / Moderation</div></div></div></div>`}
function launch(){return `<div class="section-head"><div><div class="eyebrow">10 · Buyer Quick Launch</div><h2>Quick Launch</h2><p class="muted">購入者がロゴ・色・地域・言語などを設定して公開するまでの10ステップ。</p></div></div><div class="card"><div class="steps">${launchItems.map(([k,l],i)=>`<div class="step ${S.launch[k]?'done':''}"><b>${String(i+1).padStart(2,'0')} ${l}</b><small>${S.launch[k]?'反映済み':'未設定'}</small><button class="btn" style="margin-top:8px;width:100%" onclick="S.launch['${k}']=!S.launch['${k}'];render()">${S.launch[k]?'解除':'設定'}</button></div>`).join('')}</div><div class="actions"><button class="btn primary" onclick="Object.keys(S.launch).forEach(k=>S.launch[k]=true);toast('10ステップを完了しました');render()">10項目を一括完了</button></div></div>`}
function render(){let c='';switch(S.view){case'home':c=home();break;case'discover':c=discover();break;case'profileDetail':c=detail();break;case'matches':c=matchesView();break;case'messages':c=messages();break;case'notifications':c=notifications();break;case'profile':c=profile();break;case'safety':c=safety();break;case'global':c=global();break;case'settings':c=settings();break;case'admin':c=admin();break;case'launch':c=launch();break;default:c=home()}shell(c)}
render();
</script>
</body></html>
