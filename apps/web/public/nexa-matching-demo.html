<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA — Matching Demo</title>
<style>
:root{--bg:#0b0b0a;--panel:#151512;--panel2:#1b1a16;--text:#f4f0e8;--muted:#aaa398;--gold:#b9a486;--line:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#090908,#171613);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{padding:24px 16px;border-right:1px solid var(--line);background:rgba(8,8,7,.8)}.brand{font-size:22px;letter-spacing:.18em;margin:4px 10px 28px}.brand small{display:block;font-size:9px;letter-spacing:.28em;color:var(--gold);margin-top:6px}.nav{display:grid;gap:6px}.nav button,.ghost{background:transparent;border:1px solid transparent;color:var(--muted);text-align:left;padding:12px 14px;border-radius:9px}.nav button.active,.nav button:hover{background:rgba(185,164,134,.09);color:var(--text);border-color:rgba(185,164,134,.15)}.main{padding:28px;max-width:1200px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--gold)}h1{font-size:34px;font-weight:500;margin:7px 0}.sub{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar button,.toolbar select,.search{background:#12120f;border:1px solid var(--line);color:var(--text);padding:11px 14px;border-radius:9px}.search{min-width:230px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.filters button{border:1px solid var(--line);background:#11110f;color:var(--muted);padding:8px 12px;border-radius:999px}.filters button.active{background:var(--gold);color:#11110f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{position:relative;background:linear-gradient(145deg,#1d1c18,#10100e);border:1px solid var(--line);border-radius:15px;padding:18px;min-height:290px;box-shadow:0 22px 60px rgba(0,0,0,.2)}.avatar{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#cbbda5,#6c604f);color:#111;font-size:25px;font-weight:700}.online{width:10px;height:10px;background:#91b89a;border:2px solid #171613;border-radius:50%;position:absolute;top:72px;left:69px}.card h3{margin:16px 0 4px;font-size:21px}.role,.muted{color:var(--muted);font-size:13px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}.tag{padding:5px 8px;border-radius:999px;background:rgba(185,164,134,.09);color:#d9cdbb;font-size:11px}.score{position:absolute;right:18px;top:18px;text-align:right}.score b{display:block;font-size:24px}.score span{font-size:10px;color:var(--muted)}.actions{display:flex;gap:8px;margin-top:18px}.actions button,.primary{flex:1;border:1px solid var(--line);background:#11110f;color:var(--text);padding:11px;border-radius:9px}.actions .primary,.primary{background:var(--gold);color:#11110f;border-color:var(--gold)}.matched{border-color:rgba(185,164,134,.65);box-shadow:0 0 0 1px rgba(185,164,134,.16),0 25px 70px rgba(185,164,134,.08)}.badge{position:absolute;right:15px;bottom:18px;color:var(--gold);font-size:10px;letter-spacing:.2em}.empty{padding:36px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}.list{display:grid;gap:10px}.row{display:flex;align-items:center;gap:14px;background:#141410;border:1px solid var(--line);padding:14px;border-radius:11px}.row .avatar{width:48px;height:48px;font-size:17px;flex:0 0 auto}.row .grow{flex:1}.row button{border:1px solid var(--line);background:transparent;color:var(--text);padding:9px 12px;border-radius:8px}.chat{border:1px solid var(--line);border-radius:14px;background:#12120f;overflow:hidden}.chathead{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.messages{min-height:320px;padding:18px;display:grid;align-content:start;gap:9px}.bubble{max-width:75%;padding:10px 13px;border-radius:13px;background:#24231e;color:#ddd5c7}.mine{justify-self:end;background:var(--gold);color:#111}.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.compose input{flex:1;background:#0d0d0b;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px}.settings{display:grid;gap:10px}.setting{display:flex;justify-content:space-between;align-items:center;padding:17px;background:#141410;border:1px solid var(--line);border-radius:11px}.setting button{background:transparent;color:var(--gold);border:0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px;z-index:5}.dialog{width:min(520px,100%);background:#171613;border:1px solid rgba(185,164,134,.25);border-radius:15px;padding:24px;box-shadow:0 35px 100px #000}.dialog p{color:var(--muted);line-height:1.7}.dialog .close{float:right;background:transparent;border:1px solid var(--line);color:var(--text);border-radius:50%;width:32px;height:32px}.dialog .choices{display:flex;gap:8px;flex-wrap:wrap}.dialog .choices button{background:transparent;color:var(--text);border:1px solid var(--line);padding:10px 13px;border-radius:8px}.dialog .choices button:first-child{background:var(--gold);color:#111}.notice{margin:0 0 14px;padding:10px 12px;border-radius:9px;background:rgba(185,164,134,.08);color:#d8ccb9;font-size:12px}@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:3;display:flex;overflow:auto;gap:6px;padding:10px}.brand{display:none}.nav{display:flex}.nav button{white-space:nowrap}.main{padding:18px}.top{display:block}.toolbar{margin-top:14px}}
</style>
</head>
<body><div class="app"><aside class="side"><div class="brand">NEXA<small>UNIVERSAL MATCHING</small></div><nav class="nav" id="nav"></nav></aside><main class="main" id="main"></main></div>
<script>
(()=>{
const profiles=[
{id:1,name:'Mika',role:'クリエイター',place:'東京',tags:['写真','旅行','デザイン'],score:96,online:true},
{id:2,name:'Alex',role:'プロダクトマネージャー',place:'大阪',tags:['起業','音楽','カフェ'],score:91,online:true},
{id:3,name:'Lina',role:'フリーランサー',place:'京都',tags:['アート','旅','コミュニティ'],score:98,online:false},
{id:4,name:'Noah',role:'コミュニティ運営',place:'横浜',tags:['読書','イベント','地域'],score:94,online:true},
{id:5,name:'Emma',role:'デザイナー',place:'福岡',tags:['UI','映画','カフェ'],score:93,online:true},
{id:6,name:'Ken',role:'起業家',place:'名古屋',tags:['AI','事業','ランニング'],score:89,online:false}
];
const state={view:'discover',filter:'すべて',query:'',sort:'score',liked:new Set(),matches:new Set(),blocked:new Set(),sent:{},safe:true,notice:'',selected:null};
const nav=[['discover','探す'],['matches','マッチ'],['messages','メッセージ'],['notifications','通知'],['profile','プロフィール'],['safety','安心・安全'],['global','地域・言語'],['settings','設定']];
const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function renderNav(){document.querySelector('#nav').innerHTML=nav.map(([id,label])=>`<button class="${state.view===id?'active':''}" data-nav="${id}">${label}</button>`).join('');}
function modal(title,body,choices=['閉じる']){const el=document.createElement('div');el.className='modal';el.innerHTML=`<div class="dialog"><button class="close" data-close>×</button><div class="eyebrow">NEXA DEMO FLOW</div><h2>${title}</h2><p>${body}</p><div class="choices">${choices.map((x,i)=>`<button data-choice="${i}">${x}</button>`).join('')}</div></div>`;document.body.appendChild(el);el.addEventListener('click',e=>{if(e.target===el||e.target.closest('[data-close]')||e.target.closest('[data-choice]'))el.remove()})}
function filtered(){let a=profiles.filter(p=>!state.blocked.has(p.id));if(state.filter!=='すべて')a=a.filter(p=>state.filter==='恋愛'?p.tags.includes('旅行')||p.tags.includes('映画'):state.filter==='友だち'?p.tags.includes('カフェ')||p.tags.includes('読書'):state.filter==='仕事'?p.role.includes('マネージャー')||p.role.includes('起業家')||p.role.includes('デザイナー'):p.tags.includes('アート')||p.tags.includes('映画'));if(state.query)a=a.filter(p=>(p.name+p.role+p.place+p.tags.join('')).toLowerCase().includes(state.query.toLowerCase()));return a.sort((a,b)=>state.sort==='score'?b.score-a.score:state.sort==='new'?b.id-a.id:a.name.localeCompare(b.name));}
function discover(){const list=filtered();return `<div class="top"><div><div class="eyebrow">RECOMMENDED</div><h1>あなたに合う相手</h1><div class="sub">目的・興味・地域から候補を絞り込み、いいねするとマッチを作れます。</div></div><div class="toolbar"><input class="search" id="search" value="${esc(state.query)}" placeholder="名前・職種・地域・興味で検索"><select id="sort"><option value="score" ${state.sort==='score'?'selected':''}>相性順</option><option value="new" ${state.sort==='new'?'selected':''}>新着順</option><option value="name" ${state.sort==='name'?'selected':''}>名前順</option></select></div></div><div class="filters">${['すべて','恋愛','友だち','仕事','趣味'].map(x=>`<button class="${state.filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div>${state.notice?`<div class="notice">${esc(state.notice)}</div>`:''}<div class="grid">${list.map(card).join('')||'<div class="empty">条件に一致する候補がありません。</div>'}</div>`}
function card(p){const match=state.matches.has(p.id),liked=state.liked.has(p.id);return `<article class="card ${match?'matched':''}"><div class="avatar">${p.name[0]}</div>${p.online?'<span class="online"></span>':''}<div class="score"><b>${p.score}%</b><span>相性</span></div><h3>${p.name}</h3><div class="role">${p.role} · ${p.place}</div><div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="muted">${match?'相互マッチ成立':'プロフィールを確認してつながる'}</div><div class="actions"><button data-profile="${p.id}">詳細</button><button class="primary" data-like="${p.id}">${match?'✓ マッチ済み':liked?'♥ いいね済み':'♡ いいね'}</button></div>${match?'<span class="badge">MATCH</span>':''}</article>`}
function matches(){const a=profiles.filter(p=>state.matches.has(p.id));return `<div class="top"><div><div class="eyebrow">CONNECTIONS</div><h1>マッチ</h1><div class="sub">${a.length}件のマッチ。相手を選んで会話を開始できます。</div></div></div>${a.length?`<div class="list">${a.map(p=>`<div class="row"><div class="avatar">${p.name[0]}</div><div class="grow"><b>${p.name}</b><div class="muted">${p.role} · ${p.place}</div></div><button data-chat="${p.id}">メッセージ</button><button data-unmatch="${p.id}">解除</button></div>`).join('')}</div>`:'<div class="empty">まだマッチがありません。探す画面で「いいね」を押してください。</div>'}`}
function messages(){const id=state.selected||[...state.matches][0];if(!id)return '<div class="empty">まず相手を「いいね」してマッチを作成してください。</div>';const p=profiles.find(x=>x.id===id);const sent=state.sent[id]||[];return `<div class="top"><div><div class="eyebrow">MESSAGES</div><h1>${p.name}との会話</h1><div class="sub">安全モード ${state.safe?'ON':'OFF'}</div></div></div><div class="chat"><div class="chathead"><div class="avatar">${p.name[0]}</div><div><b>${p.name}</b><div class="muted">${p.role} · ${p.place}</div></div></div><div class="messages"><div class="bubble">こんにちは。プロフィールを見てくれてありがとう。</div>${sent.map(x=>`<div class="bubble mine">${esc(x)}</div>`).join('')}</div><div class="compose"><input id="message" placeholder="メッセージを入力"><button class="primary" id="send">送信</button></div></div>`}
function notifications(){return `<div class="top"><div><div class="eyebrow">ACTIVITY</div><h1>通知</h1><div class="sub">マッチ、レコメンド、安全設定のアクティビティ。</div></div><button class="ghost" id="read">すべて既読</button></div><div class="list"><div class="row"><div class="avatar">♡</div><div class="grow"><b>新しいマッチ</b><div class="muted">Mikaさんとマッチしました。</div></div><span class="muted">たった今</span></div><div class="row"><div class="avatar">✦</div><div class="grow"><b>おすすめ</b><div class="muted">あなたと96%相性のプロフィールがあります。</div></div><span class="muted">8分前</span></div><div class="row"><div class="avatar">✓</div><div class="grow"><b>安全確認</b><div class="muted">安全設定が有効です。</div></div><span class="muted">今日</span></div></div>`}
function profile(){return `<div class="top"><div><div class="eyebrow">MY PROFILE</div><h1>Satoshi</h1><div class="sub">クリエイター · 日本 · プロフィール完成度92%</div></div></div><div class="card"><div class="avatar">S</div><h3>プロフィール</h3><div class="tags"><span class="tag">デザイン</span><span class="tag">プロダクト</span><span class="tag">旅行</span></div><div class="actions"><button data-modal="プロフィールを編集">編集</button><button data-modal="公開範囲">公開範囲</button><button data-modal="本人確認">本人確認</button><button data-modal="写真・ギャラリー">写真・ギャラリー</button></div></div>`}
function safety(){return `<div class="top"><div><div class="eyebrow">TRUST & SAFETY</div><h1>安心・安全</h1><div class="sub">デモ内でブロック、通報、安全モードを確認できます。</div></div></div><div class="settings"><div class="setting"><span>安全モード</span><button id="safe">${state.safe?'ON':'OFF'}</button></div><div class="setting"><span>ブロック管理</span><button data-modal="ブロック管理">開く</button></div><div class="setting"><span>通報フロー</span><button data-modal="通報">開く</button></div><div class="setting"><span>プライバシー</span><button data-modal="プライバシー">開く</button></div></div>`}
function globalView(){return `<div class="top"><div><div class="eyebrow">GLOBAL</div><h1>地域・言語</h1><div class="sub">地域ごとのサービス設定をデモできます。</div></div></div><div class="settings"><div class="setting"><span>表示言語</span><select id="language"><option>日本語</option><option>English</option><option>한국어</option><option>中文</option></select></div><div class="setting"><span>利用地域</span><select id="region"><option>日本</option><option>米国</option><option>EU</option><option>東南アジア</option></select></div></div>`}
function settings(){return `<div class="top"><div><div class="eyebrow">SETTINGS</div><h1>設定</h1><div class="sub">デモの動作設定を確認できます。</div></div></div><div class="settings"><div class="setting"><span>安全モード</span><button id="safe">${state.safe?'ON':'OFF'}</button></div><div class="setting"><span>通知設定</span><button data-modal="通知設定">カスタム</button></div><div class="setting"><span>表示・アクセシビリティ</span><button data-modal="表示・アクセシビリティ">標準</button></div><div class="setting"><span>アカウント</span><button data-modal="アカウント管理">管理</button></div></div>`}
function render(){renderNav();$('#main').innerHTML=state.view==='discover'?discover():state.view==='matches'?matches():state.view==='messages'?messages():state.view==='notifications'?notifications():state.view==='profile'?profile():state.view==='safety'?safety():state.view==='global'?globalView():settings();bind();}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.view=b.dataset.nav;render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});document.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>{const id=+b.dataset.like;state.liked.add(id);state.matches.add(id);state.notice='相互マッチが成立しました。メッセージ画面から会話できます。';render()});document.querySelectorAll('[data-unmatch]').forEach(b=>b.onclick=()=>{const id=+b.dataset.unmatch;state.matches.delete(id);state.notice='マッチを解除しました。';render()});document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.chat;state.view='messages';render()});document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{const p=profiles.find(x=>x.id==b.dataset.profile);modal(p.name+' / プロフィール詳細',`${p.role} · ${p.place}<br><br>相性 ${p.score}%<br>興味: ${p.tags.join(' / ')}`,['いいねしてマッチ','閉じる']);document.querySelector('.dialog [data-choice]')?.addEventListener('click',()=>{state.liked.add(p.id);state.matches.add(p.id);state.notice=p.name+'さんとマッチしました。';render()})});document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>modal(b.dataset.modal,'このデモでは実際の設定フローを確認できます。購入者はブランド、認証方式、公開ルールなどを自分のサービスに合わせて変更できます。'));const safe=$('#safe');if(safe)safe.onclick=()=>{state.safe=!state.safe;render()};const search=$('#search');if(search){search.oninput=()=>{state.query=search.value;const pos=search.selectionStart;render();const n=$('#search');n.focus();n.setSelectionRange(pos,pos)};search.onkeydown=e=>{if(e.key==='Enter')render()}}const sort=$('#sort');if(sort)sort.onchange=()=>{state.sort=sort.value;render()};const send=$('#send');if(send)send.onclick=()=>{const input=$('#message');if(input.value.trim()){state.sent[state.selected||[...state.matches][0]]=[...(state.sent[state.selected||[...state.matches][0]]||[]),input.value.trim()];render()}};const read=$('#read');if(read)read.onclick=()=>{state.notice='通知をすべて既読にしました。';render()}}
render();
})();
</script></body></html>
