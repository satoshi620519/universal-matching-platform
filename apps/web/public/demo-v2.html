<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXA — Interactive Product Demo</title>
<style>
:root{--bg:#0b0b0a;--panel:#141411;--panel2:#1b1a16;--text:#f3eee4;--muted:#8d897f;--gold:#b9a486;--line:#2a2823;--ok:#8ebf9a;--danger:#d78d86}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;background:linear-gradient(#11110f,#0b0b0a)}.brand{font-size:18px;letter-spacing:.16em;margin:4px 10px 32px}.brand b{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--gold);margin-right:8px;color:var(--gold)}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#8e8a82;text-align:left;padding:12px;border-radius:7px}.nav button:hover,.nav button.active{background:#1b1915;color:var(--text)}.nav button span{margin-right:10px;color:var(--gold)}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:18px 10px;color:var(--muted);font-size:11px;line-height:1.7}.sidefoot b{color:var(--ok)}main{min-width:0}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#10100e}.top small{color:var(--muted);letter-spacing:.12em}.badge{background:var(--gold);color:#111;padding:4px 8px;border-radius:999px;font-size:10px}.content{max-width:1120px;margin:auto;padding:44px 34px 80px}.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--gold)}h1{font-size:40px;font-weight:450;letter-spacing:-.04em;margin:8px 0 10px}h2{font-size:26px;font-weight:450;margin:0}.sub{color:var(--muted);line-height:1.7;margin:0 0 28px}.toolbar{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.btn{border:1px solid var(--line);background:transparent;color:#c9c3b7;padding:10px 15px;border-radius:7px}.btn:hover{border-color:#655b4d}.primary{background:var(--gold);border-color:var(--gold);color:#111}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.card{background:linear-gradient(145deg,#171714,#10100f);border:1px solid var(--line);border-radius:12px;padding:22px}.profile{display:grid;grid-template-columns:130px 1fr;gap:24px;align-items:center}.avatar{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#a28f73,#39352d 52%,#171612);font:italic 60px Georgia;color:#e8dfd2}.meta{color:var(--muted);font-size:13px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}.tag{border:1px solid var(--line);padding:6px 9px;color:#aaa49a;font-size:11px;border-radius:999px}.score{font-size:34px;color:var(--gold)}.actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.stat{border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:11px}.stat b{display:block;color:var(--text);font-size:18px;margin-top:3px}.list{display:grid;gap:9px}.row{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:9px;background:#131310}.mini{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#39342c;color:#eee;font-family:Georgia}.row .grow{flex:1}.row b{font-weight:450}.row small{display:block;color:var(--muted);margin-top:3px}.empty{padding:50px;text-align:center;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}.chat{min-height:500px;display:flex;flex-direction:column}.bubbles{flex:1;display:grid;align-content:start;gap:10px;padding:20px 0}.bubble{max-width:70%;padding:11px 14px;border-radius:9px;background:#22201b;color:#c5c0b7;line-height:1.6;font-size:13px}.mine{justify-self:end;background:var(--gold);color:#111}.compose{display:flex;border-top:1px solid var(--line);padding-top:12px}.compose input{flex:1;background:#11110f;border:1px solid var(--line);color:#eee;padding:12px;border-radius:7px 0 0 7px;outline:none}.compose button{border:0;background:var(--gold);padding:0 20px;border-radius:0 7px 7px 0}.settings{display:grid;gap:9px}.setting{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:16px;border-radius:9px;background:#131310}.setting span{color:var(--muted)}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;color:var(--muted);font-size:12px}.form input,.form select,.form textarea{background:#10100e;border:1px solid var(--line);color:#eee;padding:11px;border-radius:7px}.progress{height:5px;background:#24221d;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--gold);transition:.2s}.toast{position:fixed;right:24px;bottom:24px;background:#eae2d4;color:#111;padding:13px 16px;border-radius:8px;box-shadow:0 20px 50px #0008;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:4;border-right:0;border-bottom:1px solid var(--line);padding:10px}.brand,.sidefoot{display:none}.nav{grid-template-columns:repeat(4,1fr)}.nav button{text-align:center;font-size:10px;padding:9px}.nav button span{display:block;margin:0 0 3px}.content{padding:28px 16px 60px}.grid{grid-template-columns:1fr}.profile{grid-template-columns:90px 1fr}.avatar{width:90px;height:90px;font-size:42px}h1{font-size:31px}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand"><b>N</b>NEXA</div><nav class="nav" id="nav"></nav><div class="sidefoot">DEMO MODE<br><b>● 安全設定 ON</b><br>すべて架空のデータです</div></aside><main><header class="top"><small>UNIVERSAL MATCHING PLATFORM / PRODUCT WALKTHROUGH</small><span class="badge" id="notifBadge">3 通知</span></header><div class="content" id="content"></div></main></div><div class="toast" id="toast"></div>
<script>
const profiles=[{id:'mika',name:'Mika',role:'クリエイター',place:'東京',score:96,initial:'M',tags:['写真','旅行','デザイン'],online:true},{id:'alex',name:'Alex',role:'プロダクトマネージャー',place:'大阪',score:91,initial:'A',tags:['起業','音楽','カフェ'],online:true},{id:'lina',name:'Lina',role:'フリーランサー',place:'京都',score:98,initial:'L',tags:['アート','旅','コミュニティ'],online:false},{id:'noah',name:'Noah',role:'コミュニティ運営',place:'横浜',score:94,initial:'N',tags:['読書','イベント','地域'],online:true}];
const launchItems=['ブランド名・ロゴ','カラー・画像','対象地域','言語・用語','カテゴリ','プロフィール項目','マッチングルール','安全・通報方針','通知設定','利用規約・サポート'];
const state={view:'discover',index:0,liked:new Set(),incoming:new Set(['mika']),matches:new Set(),blocked:new Set(),messages:[],notifications:3,safe:true,language:'日本語',region:'日本',category:'すべて',profile:{name:'Satoshi',role:'クリエイター',bio:'プロダクトとデザインが好きです。'},config:{brand:'NEXA',color:'シャンパンゴールド',category:'コミュニティ',published:false,steps:new Set()}};
const nav=[['discover','⌕','探す'],['matches','♡','マッチ'],['messages','▱','メッセージ'],['notifications','◌','通知'],['profile','◎','プロフィール'],['safety','◇','安心・安全'],['global','◍','地域・言語'],['settings','⚙','設定'],['admin','▣','管理・分析'],['launch','◆','Quick Launch']];
const $=s=>document.querySelector(s);const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove('show'),1800)};
function navRender(){$('#nav').innerHTML=nav.map(([id,ic,label])=>`<button class="${state.view===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${label}</button>`).join('')}
function go(v){state.view=v;render()}
function current(){const a=profiles.filter(p=>!state.blocked.has(p.id));if(!a.length)return null;if(state.index>=a.length)state.index=0;return a[state.index]}
function like(){const p=current();if(!p)return;if(state.liked.has(p.id)){toast('すでに「いいね」済みです');return}state.liked.add(p.id);toast(`${p.name}さんに「いいね」を送りました`);render()}
function mutual(id){if(!state.liked.has(id)){toast('先に「いいね」を送ってください');return}state.matches.add(id);toast('相互いいね。マッチが成立しました');render()}
function next(){if(current()){state.index++;render()}}
function block(){const p=current();if(!p)return;state.blocked.add(p.id);state.liked.delete(p.id);state.matches.delete(p.id);toast(`${p.name}さんをブロックしました`);render()}
function report(){const p=current();if(!p)return;state.notifications++;toast('通報を管理キューへ送信しました');render()}
function send(){const i=$('#message');if(i&&i.value.trim()){state.messages.push(i.value.trim());toast('メッセージを送信しました');render()}}
function discover(){const p=current();if(!p)return `<div class="empty">候補がありません。</div>`;const liked=state.liked.has(p.id),match=state.matches.has(p.id),incoming=state.incoming.has(p.id);return `<div class="toolbar"><div><div class="eyebrow">RECOMMENDED</div><h1>あなたに合う相手</h1><p class="sub">${state.config.brand} · ${state.config.category} · ${state.region}</p></div><button class="btn" onclick="state.category=state.category==='すべて'?'仕事':'すべて';render()">絞り込み: ${state.category}</button></div><div class="grid"><section class="card"><div class="profile"><div class="avatar">${p.initial}</div><div><div class="meta">${p.online?'● オンライン':'○ 最近アクティブ'}</div><h2>${p.name}</h2><p class="meta">${p.role} · ${p.place}</p><div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div></div><div style="margin-top:18px"><span class="score">${p.score}%</span><span class="meta"> 相性</span></div><div class="actions"><button class="btn" onclick="next()">スキップ</button><button class="btn primary" onclick="like()">${liked?'✓ いいね済み':'♡ いいね'}</button><button class="btn" onclick="next()">次へ →</button></div>${incoming&&!match?`<div class="card" style="margin-top:14px"><b>${p.name}さんからも「いいね」が届いています</b><div class="actions"><button class="btn primary" onclick="mutual('${p.id}')">相互マッチを成立</button></div></div>`:''}${match?`<div class="card" style="margin-top:14px"><b>✓ MATCH成立</b><p class="meta">メッセージを開始できます。</p><button class="btn primary" onclick="go('messages')">メッセージを開く</button></div>`:''}</section><aside><div class="card"><div class="eyebrow">LIVE STATE</div><div class="stats"><div class="stat">いいね<b>${state.liked.size}</b></div><div class="stat">マッチ<b>${state.matches.size}</b></div><div class="stat">安全<b>${state.safe?'ON':'OFF'}</b></div></div></div><div class="card" style="margin-top:16px"><b>候補への操作</b><div class="actions"><button class="btn danger" onclick="block()">ブロック</button><button class="btn" onclick="report()">通報</button></div><p class="meta">ブロックは候補から即時除外。通報は管理キューへ。</p></div></aside></div>`}
function matches(){const a=[...state.matches].map(id=>profiles.find(p=>p.id===id)).filter(Boolean);return `<div class="toolbar"><div><div class="eyebrow">CONNECTIONS</div><h1>マッチ一覧</h1></div><span class="meta">${a.length} 件</span></div>${a.length?`<div class="list">${a.map(p=>`<div class="row"><div class="mini">${p.initial}</div><div class="grow"><b>${p.name}</b><small>${p.role} · ${p.place}</small></div><button class="btn primary" onclick="go('messages')">メッセージ</button></div>`).join('')}</div>`:'<div class="empty">相互いいねが成立すると、ここにマッチが表示されます。</div>'}`}
function messages(){return `<div class="toolbar"><div><div class="eyebrow">MESSAGES</div><h1>安全な会話</h1></div></div><div class="card chat"><div class="row"><div class="mini">M</div><div><b>Mika</b><small>マッチ済み · 安全モード ${state.safe?'ON':'OFF'}</small></div></div><div class="bubbles"><div class="bubble">こんにちは。プロフィールを見てくれてありがとう。</div>${state.messages.map(m=>`<div class="bubble mine">${esc(m)}</div>`).join('')}</div><div class="compose"><input id="message" placeholder="メッセージを入力…" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">送信</button></div></div>`}
function notifications(){return `<div class="toolbar"><div><div class="eyebrow">ACTIVITY</div><h1>通知</h1></div><button class="btn" onclick="state.notifications=0;render()">すべて既読</button></div><div class="list"><div class="row"><div class="mini">♡</div><div class="grow"><b>新しいマッチ候補</b><small>相互いいねを確認するとマッチできます。</small></div><small>たった今</small></div><div class="row"><div class="mini">✓</div><div class="grow"><b>安全確認</b><small>安全モードが ${state.safe?'有効':'無効'} です。</small></div><small>今日</small></div></div>`}
function profile(){return `<div class="toolbar"><div><div class="eyebrow">MY PROFILE</div><h1>プロフィール</h1></div></div><div class="grid"><div class="card"><div class="profile"><div class="avatar">S</div><div><h2>${esc(state.profile.name)}</h2><p class="meta">${esc(state.profile.role)} · ${state.region}</p></div></div><p class="sub" style="margin-top:20px">${esc(state.profile.bio)}</p><div class="actions"><button class="btn primary" onclick="editProfile()">プロフィールを編集</button><button class="btn" onclick="toast('本人確認済みとして表示')">本人確認 ✓</button></div></div><div class="card"><b>公開設定</b><div class="settings" style="margin-top:14px"><div class="setting"><span>公開範囲</span><b>公開</b></div><div class="setting"><span>ギャラリー</span><b>6枚</b></div></div></div></div>`}
function editProfile(){const n=prompt('表示名',state.profile.name);if(n===null)return;state.profile.name=n||state.profile.name;toast('プロフィールを保存しました');render()}
function safety(){return `<div class="toolbar"><div><div class="eyebrow">TRUST & SAFETY</div><h1>安心・安全</h1></div><span class="badge">${state.safe?'保護中':'手動設定'}</span></div><div class="settings"><div class="setting"><span>安全モード<br><small>迷惑行為対策を優先</small></span><button class="btn ${state.safe?'primary':''}" onclick="state.safe=!state.safe;render()">${state.safe?'ON':'OFF'}</button></div><div class="setting"><span>ブロック済み</span><b>${state.blocked.size} 件</b></div><div class="setting"><span>通報送信</span><button class="btn" onclick="report()">管理へ送る</button></div><div class="setting"><span>位置情報</span><b>保護</b></div></div>`}
function global(){return `<div class="toolbar"><div><div class="eyebrow">GLOBAL</div><h1>地域・言語</h1></div></div><div class="card form"><label>表示言語<select onchange="state.language=this.value;render()"><option ${state.language==='日本語'?'selected':''}>日本語</option><option ${state.language==='English'?'selected':''}>English</option><option>한국어</option><option>中文</option></select></label><label>利用地域<select onchange="state.region=this.value;render()"><option ${state.region==='日本'?'selected':''}>日本</option><option>米国</option><option>EU</option><option>東南アジア</option></select></label><div class="stats"><div class="stat">地域<b>${state.region}</b></div><div class="stat">言語<b>${state.language}</b></div><div class="stat">Timezone<b>JST</b></div></div></div>`}
function settings(){return `<div class="toolbar"><div><div class="eyebrow">SETTINGS</div><h1>設定</h1></div></div><div class="settings"><div class="setting"><span>安全モード</span><button class="btn ${state.safe?'primary':''}" onclick="state.safe=!state.safe;render()">${state.safe?'ON':'OFF'}</button></div><div class="setting"><span>通知設定</span><b>カスタム</b></div><div class="setting"><span>アクセシビリティ</span><b>標準</b></div><div class="setting"><span>アカウント</span><b>管理</b></div></div>`}
function admin(){return `<div class="toolbar"><div><div class="eyebrow">OPERATOR</div><h1>管理・分析</h1></div><span class="badge">LIVE DEMO</span></div><div class="grid"><div class="card"><h2>サービス概況</h2><div class="stats"><div class="stat">候補<b>${profiles.length-state.blocked.size}</b></div><div class="stat">いいね<b>${state.liked.size}</b></div><div class="stat">マッチ<b>${state.matches.size}</b></div></div></div><div class="card"><h2>安全キュー</h2><div class="settings" style="margin-top:14px"><div class="setting"><span>通報・確認待ち</span><b>${state.notifications}</b></div><div class="setting"><span>ブロック済み</span><b>${state.blocked.size}</b></div></div></div></div><div class="card" style="margin-top:16px"><b>公開中のサービス設定</b><p class="sub">ブランド: ${esc(state.config.brand)} / カテゴリ: ${esc(state.config.category)} / 地域: ${esc(state.region)}</p><div class="progress"><i style="width:${state.config.published?'100%':Math.round(state.config.steps.size/10*100)}%"></i></div></div>`}
function configure(key){if(key==='brand'){const v=prompt('ブランド名',state.config.brand);if(v)state.config.brand=v}else if(key==='color'){const v=prompt('ブランドカラー',state.config.color);if(v)state.config.color=v}else if(key==='region'){const v=prompt('対象地域',state.region);if(v)state.region=v||state.region}else if(key==='language'){const v=prompt('表示言語',state.language);if(v)state.language=v||state.language}else if(key==='category'){const v=prompt('カテゴリ',state.config.category);if(v)state.config.category=v||state.config.category}else{toast('設定項目を確認しました')}state.config.steps.add(key);render()}
function publish(){if(state.config.steps.size<10){toast(`公開前に残り ${10-state.config.steps.size} 項目を設定してください`);return}state.config.published=true;toast(`公開バージョン v1.0-demo を作成しました`);render()}
function launch(){const labels=[['brand','ブランド名・ロゴ'],['color','カラー・画像'],['region','対象地域'],['language','言語・用語'],['category','カテゴリ'],['profile','プロフィール項目'],['rules','マッチングルール'],['safety','安全・通報方針'],['notify','通知設定'],['legal','利用規約・サポート']];const done=state.config.steps.size;return `<div class="toolbar"><div><div class="eyebrow">BUYER QUICK LAUNCH</div><h1>Quick Launch</h1><p class="sub">購入者がコードを書かずに、販売後のサービス仕様を組み立てる導線です。</p></div><span class="badge">${done}/10 設定済み</span></div><div class="card" style="margin-bottom:16px"><div class="stats"><div class="stat">ブランド<b>${esc(state.config.brand)}</b></div><div class="stat">カテゴリ<b>${esc(state.config.category)}</b></div><div class="stat">地域<b>${esc(state.region)}</b></div></div><div class="progress" style="margin-top:18px"><i style="width:${done/10*100}%"></i></div></div><div class="list">${labels.map(([k,x],i)=>`<div class="row"><div class="mini">${String(i+1).padStart(2,'0')}</div><div class="grow"><b>${x}</b><small>${state.config.steps.has(k)?'設定済み · 現在のデモに反映':'購入者がサービス仕様を決める設定項目'}</small></div><button class="btn ${state.config.steps.has(k)?'primary':''}" onclick="configure('${k}')">${state.config.steps.has(k)?'編集':'設定'}</button></div>`).join('')}</div><div class="actions"><button class="btn primary" onclick="publish()">${state.config.published?'公開済み ✓':'公開バージョンを作成'}</button><button class="btn" onclick="go('discover')">公開内容を見る</button></div>`}
function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function render(){navRender();const views={discover,matches,messages,notifications,profile,safety,global,settings,admin,launch};$('#content').innerHTML=views[state.view]();$('#notifBadge').textContent=`${state.notifications} 通知`}
render();
</script></body></html>
