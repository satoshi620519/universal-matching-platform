<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA — Universal Matching Platform Demo</title><style>html,body{margin:0;height:100%;background:#080a0e}iframe{display:block;width:100%;height:100%;border:0}.panel{position:fixed;right:18px;bottom:18px;z-index:80;width:min(340px,calc(100vw - 36px));border:1px solid #29303b;border-radius:14px;background:#11151cf5;box-shadow:0 14px 40px #0008;color:#f5f4ef;font:12px system-ui;backdrop-filter:blur(12px)}.head{padding:11px 14px;border-bottom:1px solid #29303b;font-weight:800}.body{padding:12px 14px}.muted{color:#9da5b2;line-height:1.55}.result{display:none;margin-top:10px;padding:9px 10px;border-radius:9px;border:1px solid #3a414d;background:#171c25;line-height:1.45}.row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.btn{padding:8px 10px;border:1px solid #29303b;background:#171c25;color:#fff;border-radius:8px;cursor:pointer}.primary{border-color:#d9bd7d;background:#d9bd7d;color:#17140e;font-weight:800}.danger{border-color:#704047;color:#ffb0b0}@media(max-width:700px){.panel{right:10px;bottom:10px;width:min(320px,calc(100vw - 20px))}}</style></head><body><iframe id="demo" src="/demo-v6.html" title="NEXA Universal Matching Platform Demo"></iframe><div class="panel"><div class="head">購入検討者向け・機能チェック</div><div class="body"><div class="muted">主要フロー完了後も、安全機能を含む各画面をワンクリックで確認できます。操作はデモ内の架空データだけに反映されます。</div><div class="result" id="result" aria-live="polite"></div><div class="row"><button class="btn primary" id="discover">候補を見る</button><button class="btn" id="matches">MATCH一覧</button><button class="btn" id="messages">メッセージ</button><button class="btn" id="global">地域・言語</button><button class="btn" id="admin">管理・分析</button><button class="btn" id="launch">Quick Launch</button></div><div class="row"><button class="btn danger" id="report">通報を体験</button><button class="btn danger" id="block">ブロックを体験</button><button class="btn" id="reset">デモをリセット</button></div></div></div><script>
const f=document.getElementById('demo');const w=()=>f.contentWindow;const result=t=>{const e=document.getElementById('result');e.textContent=t;e.style.display='block'};const go=v=>{if(w().go)w().go(v)};document.getElementById('discover').onclick=()=>go('discover');document.getElementById('matches').onclick=()=>go('matches');document.getElementById('messages').onclick=()=>go('messages');document.getElementById('global').onclick=()=>go('global');document.getElementById('admin').onclick=()=>go('admin');document.getElementById('launch').onclick=()=>go('launch');document.getElementById('report').onclick=()=>{const x=w().P.find(p=>!w().S.reported.has(p.id)&&!w().S.blocked.has(p.id));if(x){w().report(x.id);w().go('safety');result(`${x.name} を通報しました。安全画面で処理結果を確認できます。`)}};document.getElementById('block').onclick=()=>{const x=w().P.find(p=>!w().S.blocked.has(p.id));if(x){w().block(x.id);result(`${x.name} をブロックしました。候補・MATCH対象から除外されます。`)}};document.getElementById('reset').onclick=()=>w().location.reload();
</script></body></html>
