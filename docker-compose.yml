services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: universal
      POSTGRES_PASSWORD: universal
      POSTGRES_DB: universal_matching
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U universal -d universal_matching"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 5s
      retries: 10
