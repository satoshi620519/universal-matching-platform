name: Matching Concurrency Gate

on:
  workflow_dispatch:
    inputs:
      evidence_label:
        description: 'Optional label for manually captured execution evidence'
        required: false
        default: 'manual'
  push:
    paths:
      - 'apps/api/src/matching/**'
      - 'apps/api/prisma/**'
      - 'packages/database/migrations/**'
      - 'apps/api/package.json'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'packages/database/package.json'
      - 'packages/database/**'
      - 'packages/domain/**'
      - 'apps/api/scripts/run-matching-concurrency-integration.mjs'
      - '.github/workflows/matching-concurrency.yml'

concurrency:
  group: matching-concurrency-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres-concurrency:
    name: PostgreSQL reciprocal transition evidence
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: universal_matching
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d universal_matching"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Run isolated PostgreSQL concurrency evidence
        id: concurrency
        env:
          MATCHING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/universal_matching
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @universal/api test:matching:concurrency 2>&1 | tee matching-concurrency.log
      - name: Attest gate result
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.concurrency.outcome }}
        run: |
          test -f matching-concurrency.log
          echo "DATABASE_ENGINE=PostgreSQL 16" >> "$GITHUB_STEP_SUMMARY"
          echo "EVIDENCE_COMMIT=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "EVIDENCE_LABEL=${{ inputs.evidence_label || 'path-triggered' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TEST_OUTCOME" = "success" ]; then
            test -s matching-concurrency.log
            echo "MATCHING_CONCURRENCY_GATE=passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "MATCHING_CONCURRENCY_GATE=failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$GITHUB_STEP_SUMMARY"
      - name: Upload concurrency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matching-concurrency-evidence-${{ github.sha }}
          path: matching-concurrency.log
          if-no-files-found: error
