name: Apply auth sales styling

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-auth-css:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the production-style universal matching home
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('apps/web/src/landing.tsx')
          text = path.read_text(encoding='utf-8')
          marker = "import './landing-final.css';"
          addition = "import './auth-sales.css';"
          if addition not in text:
              text = text.replace(marker, marker + chr(10) + addition, 1)
          start = text.find('if(!credential)return <div className="fp-page fp-authRequired">')
          if start < 0:
              raise SystemExit('Auth home start not found; refusing unsafe edit')
          end = text.find(';</div>;', start)
          if end < 0:
              end = text.find('</div>;', start)
          if end < 0:
              raise SystemExit('Auth home end not found; refusing unsafe edit')
          end += len('</div>;')
          new = '''if(!credential)return <div className="fp-page fp-authRequired"><header className="fp-homeHeader"><div className="fp-brandLockup"><span className="fp-brandMark">N</span><div><strong>NEXA</strong><span>UNIVERSAL MATCHING</span></div></div><span className="fp-liveBadge">LIVE PREVIEW · DEMO</span></header><section className="fp-homeHero"><div className="fp-heroCopy"><span className="fp-kicker">ONE PLATFORM · MANY POSSIBILITIES</span><h3>人と目的をつなぐ、<em>あなたのマッチングサービス。</em></h3><p>恋愛、友だち、仕事、スキル、趣味、地域コミュニティまで。ひとつの洗練された基盤から、独自のサービスを立ち上げられます。</p><div className="fp-homeFilters"><button className="selected">すべて</button><button>Relationship</button><button>Work</button><button>Skills</button><button>Community</button></div><div className="fp-heroActions"><button className="fp-primaryCta" onClick={()=>{setAuthError('');setAuthOpen(true)}}>デモを体験する <b>↗</b></button><span>Web · iOS · Android</span></div></div><div className="fp-heroVisual"><div className="fp-visualTop"><span>DISCOVER</span><span>● 24 ACTIVE</span></div><div className="fp-featureCard"><div className="fp-featureImage"><span>NM</span><i>96%</i></div><div className="fp-featureMeta"><span>RECOMMENDED FOR YOU</span><h4>Find your next connection.</h4><p>目的 · 興味 · 地域 · 言語</p><div className="fp-featureTags"><b>Photography</b><b>Travel</b><b>Design</b></div></div></div><div className="fp-floatingCard"><span className="fp-miniavatar">A</span><div><b>Alex · Osaka</b><small>共通の興味が見つかりました</small></div><strong>91%</strong></div></div></section><section className="fp-purposeStrip"><div><span className="fp-kicker">BUILT FOR YOUR MARKET</span><h4>ひとつの基盤で、無限の用途。</h4></div><div className="fp-purposeItems"><span>01 恋愛・パートナー</span><span>02 仕事・人材</span><span>03 スキル・サービス</span><span>04 趣味・コミュニティ</span><span>05 地域・ビジネス</span></div></section><section className="fp-homeBottom"><span>⌕ 検索</span><span>♡ マッチ</span><span>▱ メッセージ</span><span>◌ 通知</span><span>◎ プロフィール</span><span>◇ 安心・安全</span><span>◍ 地域・言語</span></section><footer className="fp-homeCta"><div><b>あなたのブランドで始める。</b><span>ロゴ・カラー・画像を変え、必要に応じてソースコードも拡張。</span></div><button onClick={()=>{setAuthError('');setAuthOpen(true)}}>ログイン / デモ開始 →</button></footer></div>;'''
          text = text[:start] + new + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/landing.tsx
          git diff --cached --quiet || git commit -m "Refine production universal matching home"
          git push
