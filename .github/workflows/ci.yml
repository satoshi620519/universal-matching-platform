name: CI
on:
  push:
  pull_request:
jobs:
  baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: universal_matching
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d universal_matching"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/universal_matching
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck\n        run: pnpm typecheck 2>&1 | tee typecheck.log\n      - name: Upload typecheck diagnostics\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: typecheck-diagnostics\n          path: typecheck.log\n          if-no-files-found: warn
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
